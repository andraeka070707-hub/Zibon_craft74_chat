<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="Chat langsung dengan admin toko addon Minecraft Bedrock">
  <link rel="icon" href="data:,">
  <title>Chat admin zibon_craft74</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Atribut hidden harus selalu menang atas aturan display */
    [hidden] { display: none !important; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111b21;
      background: #efeae2;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ---------- Kerangka layar (penuh di HP) ---------- */
    .app {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      background: #efeae2;
      overflow: hidden;
    }

    /* ---------- Header hijau ---------- */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: #075e54;
      color: #fff;
      flex-shrink: 0;
    }

    .back-btn {
      flex-shrink: 0;
      width: 34px;
      height: 36px;
      margin-left: -8px;
      border: 0;
      background: none;
      color: #fff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #b0bec5;
    }

    .header-info { min-width: 0; flex: 1; }

    .admin-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #25d366;
    }

    /* ---------- Bar identitas pembeli ---------- */
    .buyer-bar {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      background: #f0f2f5;
      border-bottom: 1px solid #d1d7db;
      flex-shrink: 0;
    }

    .buyer-bar input {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px; /* 16px mencegah zoom otomatis di iPhone */
      outline: none;
    }

    .buyer-bar input:focus {
      border-color: #00a884;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
    }

    /* ---------- Kotak masuk admin ---------- */
    .inbox {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #fff;
    }

    .inbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid #e9edef;
      background: #fff;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .inbox-item:active { background: #f5f6f6; }

    .inbox-avatar {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #00a884;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
    }

    .inbox-body { min-width: 0; flex: 1; }

    .inbox-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .inbox-name {
      min-width: 0;
      font-size: 15.5px;
      font-weight: 600;
      color: #111b21;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inbox-time {
      flex-shrink: 0;
      font-size: 12px;
      color: #667781;
    }

    .inbox-last {
      margin-top: 3px;
      font-size: 13.5px;
      color: #667781;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-left: 6px;
      border-radius: 50%;
      background: #25d366;
      vertical-align: middle;
    }

    .empty-note {
      padding: 28px 20px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #667781;
    }

    .thread-view {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Area chat ---------- */
    .chat-body {
      flex: 1 1 auto;
      min-height: 0;             /* membuat area ini bisa mengecil dan di-scroll */
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 10px 12px 14px;
      background-color: #efeae2;
      background-image: radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .date-pill {
      display: table;
      margin: 4px auto 8px;
      padding: 5px 12px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
      font-size: 12.5px;
      color: #54656f;
      text-transform: uppercase;
    }

    .msg-row {
      display: flex;
      margin-top: 8px;
      animation: pop 0.18s ease-out;
    }

    .msg-row.grouped { margin-top: 2px; }   /* pesan beruntun dari pengirim yang sama */

    .msg-row.in  { justify-content: flex-start; }
    .msg-row.out { justify-content: flex-end; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- Balon pesan ---------- */
    .bubble {
      position: relative;
      display: flow-root;        /* membuat jam di pojok kanan bawah ikut terbungkus */
      max-width: 80%;
      padding: 6px 8px 6px 9px;
      border-radius: 8px;
      font-size: 14.2px;
      line-height: 1.35;
      color: #111b21;
      overflow-wrap: anywhere;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
    }

    .bubble.in  { background: #ffffff; border-top-left-radius: 0; }
    .bubble.out { background: #dcf8c6; border-top-right-radius: 0; }
    .bubble.file { min-width: 210px; }

    .bubble.in.grouped  { border-top-left-radius: 8px; }
    .bubble.out.grouped { border-top-right-radius: 8px; }

    /* Ekor balon: hanya di pesan pertama dari satu pengirim */
    .bubble.in::before,
    .bubble.out::after {
      content: "";
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .bubble.in::before {
      left: -8px;
      border-width: 0 8px 8px 0;
      border-color: transparent #ffffff transparent transparent;
    }

    .bubble.out::after {
      right: -8px;
      border-width: 0 0 8px 8px;
      border-color: transparent transparent transparent #dcf8c6;
    }

    .bubble.grouped::before,
    .bubble.grouped::after { display: none; }

    .msg-text { white-space: pre-line; }   /* menjaga baris baru dalam teks */

    .meta {
      float: right;
      display: flex;
      align-items: center;
      gap: 3px;
      margin: 4px 0 0 10px;
      font-size: 11px;
      line-height: 1;
      color: #667781;
    }

    .ticks { font-size: 12px; letter-spacing: -2px; color: #8696a0; }
    .ticks.read { color: #53bdeb; }
    .ticks.failed { color: #d93025; letter-spacing: 0; }

    /* ---------- Isi file ---------- */
    .file-wrap { min-width: 0; }

    .file-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .thumb {
      display: block;
      max-width: 100%;
      max-height: 280px;
      height: auto;
      border-radius: 6px;
      background: #d9d9d9;
    }

    .file-caption {
      margin-top: 4px;
      font-size: 12px;
      color: #667781;
      overflow-wrap: anywhere;
    }

    .file-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #f0f2f5;
      font-size: 22px;
    }

    .file-info { min-width: 0; flex: 1; }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .file-size {
      margin-top: 2px;
      font-size: 12px;
      color: #667781;
    }

    /* ---------- Kolom ketik: lampiran · teks · kirim ---------- */
    .composer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: #f0f2f5;
      flex-shrink: 0;
    }

    .attach-wrap {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    /* Ikon 📎 adalah label native untuk input file */
    .attach-btn {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Input file transparan menutupi ikon. Sentuhan jatuh langsung ke input,
       jadi pemilih file HP terbuka dari sentuhan pengguna. */
    .file-input {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
      font-size: 0;
    }

    .attach-wrap:hover .attach-btn  { background: rgba(0, 0, 0, 0.06); }
    .attach-wrap:active .attach-btn { background: rgba(0, 0, 0, 0.12); }

    .attach-wrap:has(.file-input:focus-visible) .attach-btn {
      outline: 2px solid #00a884;
      outline-offset: 2px;
    }

    .msg-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 16px;
      border: none;
      border-radius: 21px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .msg-input:focus { box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.25); }

    .send-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:active { transform: scale(0.95); }

    /* ---------- Notifikasi kecil ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(76px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 9px 14px;
      border-radius: 8px;
      background: rgba(17, 27, 33, 0.92);
      color: #fff;
      font-size: 13.5px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
    }

    /* ---------- Dialog nama pembeli ---------- */
    .dialog-overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(11, 20, 26, 0.45);
    }

    .dialog {
      width: 100%;
      max-width: 340px;
      padding: 20px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .dialog-title {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 600;
      color: #111b21;
    }

    .dialog-text {
      margin: 0 0 14px;
      font-size: 13.5px;
      line-height: 1.4;
      color: #54656f;
    }

    .dialog-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .dialog-input:focus {
      border-color: #00a884;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
    }

    .dialog-error {
      min-height: 18px;
      margin-top: 6px;
      font-size: 12.5px;
      color: #d93025;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost   { background: transparent; color: #00a884; }
    .btn-primary { background: #00a884; color: #fff; }

    /* =========================================================
       DESKTOP — tampilan sebagai kartu di tengah layar
       ========================================================= */
    @media (min-width: 768px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2vh 0;
        background: #d1d7db;
      }

      .app {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        left: auto;
        width: 100%;
        max-width: 960px;
        height: 96vh;
        max-height: 900px;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(11, 20, 26, 0.25);
      }

      .bubble { max-width: 62%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg-row { animation: none; }
    }
    /* ---------- Kartu QR DANA (muncul setelah bukti tagihan dikirim) ---------- */
    .dana-card {
      margin-top: 8px;
      padding: 12px 10px 10px;
      border-radius: 8px;
      background: #f0faf5;
      text-align: center;
    }
    .dana-amount { margin-bottom: 8px; font-size: 15px; font-weight: 700; color: #075e54; }
    .dana-qr {
      display: block;
      width: 100%;
      max-width: 230px;
      height: auto;
      margin: 0 auto;
      border-radius: 6px;
      background: #ffffff;
    }
    .dana-number { margin-top: 10px; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .dana-hint { margin-top: 2px; font-size: 12.5px; color: #667781; }
    .dana-copy {
      margin-top: 8px;
      padding: 7px 16px;
      border: 0;
      border-radius: 16px;
      background: #075e54;
      color: #ffffff;
      font: inherit;
      font-size: 13.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ===================== HALAMAN PEMBELI ===================== -->
  <div class="app" id="buyerApp">
    <header class="chat-header">
      <img class="avatar" id="adminAvatar" alt="Foto profil admin" width="40" height="40">
      <div class="header-info">
        <div class="admin-name" id="adminName">admin zibon_craft74</div>
        <div class="admin-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">online</span>
        </div>
      </div>
    </header>

    <!-- Identitas pembeli: nama wajib, email opsional -->
    <section class="buyer-bar" aria-label="Data pembeli">
      <input type="text" id="buyerName" placeholder="Nama Anda *" maxlength="40" autocomplete="name" enterkeyhint="next">
      <input type="email" id="buyerEmail" placeholder="Email (opsional)" maxlength="80" autocomplete="email" enterkeyhint="done">
    </section>

    <div class="chat-body" id="chatBody" role="log" aria-live="polite">
      <div class="date-pill">Hari ini</div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="attach-wrap">
        <label for="fileInput" class="attach-btn" title="Kirim file atau bukti pembayaran">
          <span aria-hidden="true">📎</span>
        </label>
        <input type="file" id="fileInput" class="file-input" accept="*/*" aria-label="Lampirkan file">
      </div>

      <input type="text" class="msg-input" id="messageInput" placeholder="Ketik pesan" maxlength="1000" autocomplete="off" enterkeyhint="send">

      <button type="submit" class="send-btn" aria-label="Kirim pesan">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </form>

    <!-- Dialog nama: muncul jika pembeli mengirim sesuatu tanpa mengisi nama -->
    <div class="dialog-overlay" id="nameDialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <form id="dialogForm" autocomplete="off">
          <h2 class="dialog-title" id="dialogTitle">Isi nama Anda</h2>
          <p class="dialog-text">Nama diperlukan sebelum mengirim pesan atau file. Pesan Anda akan terkirim otomatis setelah disimpan.</p>
          <input type="text" id="dialogName" class="dialog-input" placeholder="Nama Anda" maxlength="40" autocomplete="name">
          <div class="dialog-error" id="dialogError" role="alert"></div>
          <div class="dialog-actions">
            <button type="button" class="btn btn-ghost" id="dialogCancel">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ===================== HALAMAN ADMIN (dibuka lewat ?admin=KUNCI) ===================== -->
  <div class="app" id="adminApp" hidden>
    <header class="chat-header">
      <button type="button" class="back-btn" id="backBtn" aria-label="Kembali" hidden>&#8249;</button>
      <div class="header-info">
        <div class="admin-name" id="adminTitle">Kotak masuk</div>
        <div class="admin-status" id="adminSub">admin zibon_craft74</div>
      </div>
    </header>

    <div class="inbox" id="inboxView"></div>

    <div class="thread-view" id="threadView" hidden>
      <div class="chat-body" id="adminChat" role="log" aria-live="polite"></div>
      <form class="composer" id="adminComposer" autocomplete="off">
        <input type="text" class="msg-input" id="adminInput" placeholder="Tulis balasan" maxlength="1000" autocomplete="off" enterkeyhint="send">
        <button type="submit" class="send-btn" aria-label="Kirim balasan">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    (() => {
      'use strict';

      /* =====================================================================
         KONFIGURASI — bagian ini saja yang perlu diubah
         ===================================================================== */

      // Info pembayaran untuk balasan otomatis (hanya tampil saat mode demo).
      const DANA_NUMBER = '0085739257269';
      const PAYMENT_INFO = 'DANA ' + DANA_NUMBER;

      const CONFIG = {
        adminName: 'admin zibon_craft74',

        // Foto admin. Kosongkan ('') untuk avatar dummy. Contoh: 'gambar/admin.png'.
        avatarUrl: '',

        // URL Web App Google Apps Script (berakhiran /exec).
        // Kosongkan ('') untuk mode demo: halaman jalan tanpa server.
        notifyUrl: '',

        buyerPollMs: 6000,        // seberapa sering pembeli mengecek balasan
        adminThreadPollMs: 4000,  // seberapa sering admin mengecek satu percakapan
        adminListPollMs: 10000,   // seberapa sering daftar percakapan admin diperbarui
        maxFileMB: 2,             // batas ukuran file yang dikirim (MB)

        botDelayMs: 1500,         // jeda balasan demo (mode demo saja)

        welcomeMessage:
          'Halo! 👋 Selamat datang di toko Addon KUJR.\n' +
          'Ketik pesan atau kirim bukti pembayaran lewat tombol 📎. Nama Anda akan diminta sebelum pesan pertama dikirim.',

        // Daftar addon. Tambah, ubah, atau hapus baris di sini.
        products: [
          { name: 'Addon Locomotif', price: 'Rp ...' },
          { name: 'KUJR ARJUNA (locomotive listrik dan inspeksi)', price: 'Rp ...' },
        ],

        // Kata kunci yang membuat balasan demo menampilkan katalog.
        catalogKeywords: ['katalog', 'daftar', 'addon', 'produk', 'list'],

        // Balasan demo berdasarkan kata kunci (dicek dari atas; yang pertama cocok dipakai).
        autoReplies: [
          {
            keys: ['bayar', 'pembayaran', 'transfer', 'qris'],
            reply: 'Silakan lakukan pembayaran ke: ' + PAYMENT_INFO + '. Setelah bayar, kirim bukti pembayaran lewat tombol 📎.',
          },
          {
            keys: ['harga', 'berapa'],
            reply: 'Harga setiap addon tertera di katalog. Ketik "katalog" untuk melihat daftarnya.',
          },
          {
            keys: ['cara', 'install', 'pasang'],
            reply: 'Buka file .mcpack atau .mcworld yang sudah diunduh, lalu pilih Minecraft Bedrock untuk mengimpornya.',
          },
          {
            keys: ['halo', 'hai', 'selamat'],
            reply: 'Halo juga! Ada yang bisa kami bantu? Ketik "katalog" untuk melihat daftar addon.',
          },
        ],

        fileReply: 'Terima kasih, file Anda sudah kami terima. Admin akan segera memeriksanya ya 🙏',
        fallbackReply: 'Terima kasih sudah menghubungi kami. Admin akan segera membalas pesan Anda.',
      };

      /* =====================================================================

      const IMAGE_EXT_RE = /\.(jpe?g|png|gif|webp|bmp|heic|heif|svg)$/i;
      const SIZE_FORMAT = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1 });
      const MAX_FILE_BYTES = CONFIG.maxFileMB * 1024 * 1024;
      const COMPRESS_OVER_BYTES = 1024 * 1024; // gambar di atas 1 MB dikecilkan dulu
      const COMPRESS_MAX_SIDE = 1600;          // sisi terpanjang setelah dikecilkan (px)
      const STICK_PX = 60;                     // jarak dari bawah yang masih dianggap "di bawah"
      const JSONP_TIMEOUT_MS = 15000;

      // Tanda centang: pending = terkirim dari HP, sent = tersimpan di server,
      // read = sudah dibalas, failed = gagal dikirim.
      const TICKS = {
        pending: { text: '✓', cls: 'ticks' },
        sent: { text: '✓✓', cls: 'ticks' },
        read: { text: '✓✓', cls: 'ticks read' },
        failed: { text: '!', cls: 'ticks failed' },
      };

      const buyer = { id: '', seen: new Set(), pending: null, polling: false };
      const admin = { current: null, seen: new Set(), inboxSig: '', inboxBusy: false, threadBusy: false };
      const demo = { timer: null, items: [] };

      let toastTimer = null;
      let jsonpCount = 0;

      /* =====================================================================
         ELEMEN HALAMAN
         ===================================================================== */
      const $ = (id) => document.getElementById(id);
      const toastEl = $('toast');

      const buyerEl = {
        app: $('buyerApp'),
        avatar: $('adminAvatar'),
        adminName: $('adminName'),
        status: $('statusText'),
        name: $('buyerName'),
        email: $('buyerEmail'),
        chat: $('chatBody'),
        form: $('composer'),
        input: $('messageInput'),
        file: $('fileInput'),
        dialog: $('nameDialog'),
        dialogForm: $('dialogForm'),
        dialogName: $('dialogName'),
        dialogError: $('dialogError'),
        dialogCancel: $('dialogCancel'),
      };

      const adminEl = {
        app: $('adminApp'),
        back: $('backBtn'),
        title: $('adminTitle'),
        sub: $('adminSub'),
        inbox: $('inboxView'),
        thread: $('threadView'),
        chat: $('adminChat'),
        form: $('adminComposer'),
        input: $('adminInput'),
      };

      /* =====================================================================
         UTILITAS
         ===================================================================== */
      const pad = (n) => String(n).padStart(2, '0');

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      }

      function saveLocal(key, value) {
        try { localStorage.setItem(key, value); } catch (err) { /* penyimpanan dimatikan: lewati */ }
      }

      function readLocal(key) {
        try { return localStorage.getItem(key) || ''; } catch (err) { return ''; }
      }

      function formatTime(value) {
        const d = value ? new Date(value) : new Date();
        if (isNaN(d.getTime())) return formatTime();
        return pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      function formatKB(kb) {
        return SIZE_FORMAT.format(kb) + ' KB';
      }

      function isImageFile(file) {
        return (file.type || '').indexOf('image/') === 0 || IMAGE_EXT_RE.test(file.name);
      }

      function initials(name) {
        return (name || '?').trim().charAt(0).toUpperCase() || '?';
      }

      function showToast(message, ms) {
        toastEl.textContent = message;
        toastEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms || 2600);
      }

      function setAvatar(img) {
        img.addEventListener('error', () => {
          if (img.dataset.fallback) return; // hindari loop jika avatar dummy pun gagal
          img.dataset.fallback = '1';
          img.src = DEFAULT_AVATAR;
        });
        img.src = CONFIG.avatarUrl || DEFAULT_AVATAR;
      }

      function note(text) {
        const p = document.createElement('div');
        p.className = 'empty-note';
        p.textContent = text;
        return p;
      }

      /* =====================================================================
         SCROLL OTOMATIS
         - Pesan atau file baru selalu membuat chat turun ke paling bawah.
         - Perubahan tinggi karena gambar selesai dimuat hanya men-scroll
           kalau pembaca memang sedang di bawah, atau itu pesan terbaru.
         ===================================================================== */
      function trackScroll(box) {
        box.dataset.stick = '1';
        box.addEventListener('scroll', () => {
          const gap = box.scrollHeight - box.scrollTop - box.clientHeight;
          box.dataset.stick = gap <= STICK_PX ? '1' : '0';
        }, { passive: true });
      }

      function scrollDown(box, force) {
        if (force || box.dataset.stick === '1') {
          box.scrollTop = box.scrollHeight;
        }
      }

      function keepInView(box, row) {
        scrollDown(box, row === box.lastElementChild);
      }

      /* =====================================================================
         GELEMBUNG PESAN
         ===================================================================== */
      function setTick(bubble, state) {
        const tick = bubble.querySelector('.ticks');
        if (!tick) return;
        const t = TICKS[state] || TICKS.pending;
        tick.textContent = t.text;
        tick.className = t.cls;
        bubble.dataset.tick = state;
      }

      function findBubble(box, cid) {
        return box.querySelector('.bubble[data-cid="' + CSS.escape(cid) + '"]');
      }

      function failBubble(bubble) {
        setTick(bubble, 'failed');
        const size = bubble.querySelector('.file-size');
        if (size) size.textContent = 'Gagal dikirim';
        showToast('Gagal mengirim. Periksa koneksi lalu coba lagi.');
      }

      function markSentAsRead(box) {
        box.querySelectorAll('.bubble.out').forEach((b) => {
          if (b.dataset.tick === 'sent') setTick(b, 'read');
        });
      }

      // Mengubah data file dari server (kolom Sheet) menjadi bentuk yang dipakai bubble
      function fileOf(m) {
        if (!m.fileNama) return null;
        return { name: m.fileNama, sizeKB: Number(m.fileKB) || 0, link: m.fileLink || '' };
      }

      function fileCard(file) {
        const card = document.createElement('div');
        card.className = 'file-card';

        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.textContent = file.previewUrl ? '🖼️' : '📦';

        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = file.name;

        const size = document.createElement('div');
        size.className = 'file-size';
        size.textContent = file.sub || formatKB(file.sizeKB);

        info.append(name, size);
        card.append(icon, info);
        return card;
      }

      // Gambar: thumbnail. File lain: kartu file (dengan link bila ada, khusus admin).
      function fileBody(file) {
        if (file.previewUrl) {
          const wrap = document.createElement('div');
          wrap.className = 'file-wrap';

          const img = document.createElement('img');
          img.className = 'thumb';
          img.alt = file.name;
          img.src = file.previewUrl;
          // Browser tidak bisa menampilkan format ini (mis. HEIC): tampilkan kartu file saja
          img.onerror = () => wrap.replaceChildren(fileCard(Object.assign({}, file, { previewUrl: '' })));

          const caption = document.createElement('div');
          caption.className = 'file-caption';
          caption.textContent = file.name + ' · ' + formatKB(file.sizeKB);

          wrap.append(img, caption);
          return wrap;
        }

        const card = fileCard(file);
        if (file.link) {
          const link = document.createElement('a');
          link.className = 'file-link';
          link.href = file.link;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.appendChild(card);
          return link;
        }
        return card;
      }

      // Menambah satu balon ke dalam kotak chat. side = 'in' (lawan bicara) atau 'out' (Anda).
      function addBubble(box, side, o) {
        const prev = box.lastElementChild;
        const grouped = !!prev && prev.classList.contains('msg-row') && prev.classList.contains(side);

        const row = document.createElement('div');
        row.className = 'msg-row ' + side + (grouped ? ' grouped' : '');

        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + side + (o.file ? ' file' : '') + (grouped ? ' grouped' : '');
        if (o.cid) bubble.dataset.cid = o.cid;

        if (o.file) {
          const body = fileBody(o.file);
          const img = body.querySelector('img');
          if (img) img.addEventListener('load', () => keepInView(box, row));
          bubble.appendChild(body);
        }

        if (o.text) {
          const text = document.createElement('div');
          text.className = 'msg-text';
          text.textContent = o.text;
          bubble.appendChild(text);
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        const time = document.createElement('span');
        time.textContent = formatTime(o.time);
        meta.appendChild(time);
        if (side === 'out') {
          const tick = document.createElement('span');
          tick.className = 'ticks';
          meta.appendChild(tick);
        }
        bubble.appendChild(meta);

        row.appendChild(bubble);
        box.appendChild(row);
        if (side === 'out') setTick(bubble, o.tick || 'pending');
        scrollDown(box, true); // setiap pesan baru turun ke paling bawah
        return bubble;
      }

      // Mengganti kartu "Memproses..." dengan thumbnail atau kartu file yang sudah siap
      function replaceFileBody(bubble, box, file) {
        const old = bubble.querySelector('.file-wrap, .file-link, .file-card');
        const body = fileBody(file);
        const img = body.querySelector('img');
        if (img) img.addEventListener('load', () => keepInView(box, bubble.parentElement));
        if (old) old.replaceWith(body);
        else bubble.insertBefore(body, bubble.firstChild);
      }

      /* =====================================================================
         JARINGAN
         - Membaca data: JSONP (script tag), karena Apps Script tidak mengirim header CORS.
         - Mengirim data: fetch no-cors. Isinya tetap sampai ke server.
         ===================================================================== */
      function jsonp(params) {
        return new Promise((resolve, reject) => {
          const cb = 'kujrCb' + (++jsonpCount) + '_' + Date.now();
          const query = new URLSearchParams(params);
          query.set('callback', cb);

          const script = document.createElement('script');
          const timer = setTimeout(() => finish(new Error('timeout')), JSONP_TIMEOUT_MS);

          function finish(err, data) {
            clearTimeout(timer);
            window[cb] = () => {};
            script.remove();
            if (err) reject(err);
            else resolve(data);
          }

          window[cb] = (data) => finish(null, data);
          script.onerror = () => finish(new Error('network'));
          script.src = CONFIG.notifyUrl + (CONFIG.notifyUrl.indexOf('?') === -1 ? '?' : '&') + query.toString();
          document.head.appendChild(script);
        });
      }

      function postJSON(body) {
        return fetch(CONFIG.notifyUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(body),
        });
      }

      /* =====================================================================
         FILE: BACA DAN KECILKAN GAMBAR
         ===================================================================== */
      function readAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('baca gagal'));
          reader.readAsDataURL(file);
        });
      }

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            const scale = Math.min(1, COMPRESS_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';                 // latar putih untuk PNG transparan
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('decode gagal'));
          };
          img.src = url;
        });
      }

      async function fileToDataUrl(file, isImage) {
        if (isImage && file.size > COMPRESS_OVER_BYTES) {
          try {
            return await compressImage(file);
          } catch (err) {
            // gagal dikecilkan (misalnya HEIC di sebagian browser): pakai file asli
          }
        }
        return readAsDataUrl(file);
      }

      /* =====================================================================
         MODE DEMO — dipakai hanya saat notifyUrl belum diisi
         ===================================================================== */
      function buildCatalogText() {
        if (!CONFIG.products.length) return 'Katalog addon sedang kosong. Silakan cek lagi nanti ya.';
        const lines = CONFIG.products.map((p, i) => (i + 1) + '. ' + p.name + ' — ' + p.price);
        return 'Daftar addon kami:\n' + lines.join('\n') +
               '\n\nKetik nama addon yang Anda minati, lalu lakukan pembayaran.';
      }

      function buildDemoReply(items) {
        if (items.some((item) => item.kind === 'file')) return CONFIG.fileReply;

        const text = (items[items.length - 1].text || '').toLowerCase();
        if (CONFIG.catalogKeywords.some((key) => text.indexOf(key) !== -1)) return buildCatalogText();

        const rule = CONFIG.autoReplies.find((r) => r.keys.some((key) => text.indexOf(key) !== -1));
        return rule ? rule.reply : CONFIG.fallbackReply;
      }

      function queueDemoReply(item) {
        demo.items.push(item);
        if (demo.timer) return; // balasan sudah dijadwalkan: pesan baru ikut di dalamnya

        setStatus('sedang mengetik...');
        demo.timer = setTimeout(() => {
          demo.timer = null;
          const items = demo.items;
          demo.items = [];
          setStatus('mode demo');
          markSentAsRead(buyerEl.chat);
          addBubble(buyerEl.chat, 'in', { text: buildDemoReply(items) });
        }, CONFIG.botDelayMs);
      }

      /* =====================================================================
         HALAMAN PEMBELI
         ===================================================================== */
      /* =====================================================================
         BUKTI TAGIHAN -> KARTU QR DANA
         Saat pembeli mengirim teks tagihan (format dari halaman pembelian),
         chat langsung menampilkan QR DANA dan nominal yang harus ditransfer.
         ===================================================================== */
      const PROOF_TOTAL_RE = /total\s*transfer\s*:?\s*\*?\s*(Rp\s?[\d.,]+)/i;
      const PROOF_INVOICE_RE = /no\.?\s*invoice\s*:?\s*\*?\s*([A-Za-z0-9-]+)/i;

      // Mengembalikan { total, invoice } jika teks memuat bukti tagihan, selain itu null.
      function parseProof(text) {
        const total = PROOF_TOTAL_RE.exec(text);
        const invoice = PROOF_INVOICE_RE.exec(text);
        if (!total && !invoice) return null;
        return {
          total: total ? total[1].replace(/\s/g, '') : '',
          invoice: invoice ? invoice[1] : '',
        };
      }

      // Balon dari admin yang berisi kartu QR DANA.
      function addDanaCard(box, proof) {
        const bubble = addBubble(box, 'in', {
          text: 'Bukti tagihan sudah kami terima. Silakan bayar lewat DANA, lalu kirim bukti transfer di chat ini.',
        });

        const card = document.createElement('div');
        card.className = 'dana-card';

        if (proof.total) {
          const amount = document.createElement('div');
          amount.className = 'dana-amount';
          amount.textContent = 'Transfer persis ' + proof.total;
          card.appendChild(amount);
        }

        const qr = document.createElement('img');
        qr.className = 'dana-qr';
        qr.alt = 'Kode QR DANA ' + DANA_NUMBER;
        qr.addEventListener('load', () => keepInView(box, bubble.parentElement));
        qr.src = DANA_QR_SRC;

        const number = document.createElement('div');
        number.className = 'dana-number';
        number.textContent = DANA_NUMBER;

        const hint = document.createElement('div');
        hint.className = 'dana-hint';
        hint.textContent = 'Cuma bisa dibayar pakai DANA' + (proof.invoice ? ' · ' + proof.invoice : '');

        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'dana-copy';
        copy.textContent = 'Salin nomor';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(DANA_NUMBER);
            showToast('Nomor DANA disalin.');
          } catch (err) {
            showToast('Gagal menyalin. Salin nomornya secara manual.', 3500);
          }
        });

        card.append(qr, number, hint, copy);
        bubble.insertBefore(card, bubble.querySelector('.meta'));
      }

      function setStatus(text) {
        buyerEl.status.textContent = text;
      }

      function persistBuyer() {
        saveLocal('kujr_buyer_name', buyerEl.name.value.trim());
        saveLocal('kujr_buyer_email', buyerEl.email.value.trim());
      }

      // Mengembalikan true jika nama sudah ada. Jika belum, aksi disimpan dan dialog nama dibuka.
      function requireName(action) {
        if (buyerEl.name.value.trim()) return true;
        buyer.pending = action;
        buyerEl.dialogName.value = '';
        buyerEl.dialogError.textContent = '';
        buyerEl.dialog.hidden = false;
        buyerEl.dialogName.focus();
        return false;
      }

      function applyBuyerMessage(m) {
        if (buyer.seen.has(m.cid)) {
          const bubble = findBubble(buyerEl.chat, m.cid);
          if (bubble && m.arah === 'pembeli' && bubble.dataset.tick === 'pending') setTick(bubble, 'sent');
          return;
        }
        buyer.seen.add(m.cid);

        if (m.arah === 'pembeli') {
          // Pesan dari riwayat (misalnya setelah halaman dibuka ulang)
          addBubble(buyerEl.chat, 'out', { cid: m.cid, text: m.teks, file: fileOf(m), time: m.waktu, tick: 'sent' });
          const proof = parseProof(m.teks || '');
          if (proof) addDanaCard(buyerEl.chat, proof);
        } else {
          // Balasan dari admin
          addBubble(buyerEl.chat, 'in', { cid: m.cid, text: m.teks, file: fileOf(m), time: m.waktu });
          markSentAsRead(buyerEl.chat);
        }
      }

      async function pollBuyer() {
        if (buyer.polling || document.hidden) return;
        buyer.polling = true;
        try {
          const res = await jsonp({ action: 'thread', buyerId: buyer.id });
          if (!res.ok) throw new Error(res.error || 'gagal');
          setStatus('online');
          res.messages.forEach(applyBuyerMessage);
        } catch (err) {
          setStatus('tidak terhubung');
        } finally {
          buyer.polling = false;
        }
      }

      function sendText() {
        const text = buyerEl.input.value.trim();
        if (!text) {
          buyerEl.input.focus();
          return;
        }
        if (!requireName({ type: 'text' })) return;

        persistBuyer();
        buyerEl.input.value = '';
        const cid = makeId();
        buyer.seen.add(cid);
        const bubble = addBubble(buyerEl.chat, 'out', { cid, text, tick: 'pending' });
        const proof = parseProof(text);

        if (CONFIG.notifyUrl) {
          postJSON({
            action: 'buyerMessage',
            buyerId: buyer.id,
            cid,
            nama: buyerEl.name.value.trim(),
            email: buyerEl.email.value.trim(),
            teks: text,
          }).catch(() => failBubble(bubble));
        } else {
          setTick(bubble, 'sent');
          if (!proof) queueDemoReply({ kind: 'text', text });
        }
        if (proof) addDanaCard(buyerEl.chat, proof);
        buyerEl.input.focus();
      }

      async function sendFile(file) {
        const isImage = isImageFile(file);
        if (!isImage && file.size > MAX_FILE_BYTES) {
          showToast('File terlalu besar. Maksimal ' + CONFIG.maxFileMB + ' MB.', 3500);
          return;
        }

        const cid = makeId();
        buyer.seen.add(cid);
        const bubble = addBubble(buyerEl.chat, 'out', {
          cid,
          file: { name: file.name, sizeKB: file.size / 1024, sub: 'Memproses...' },
          tick: 'pending',
        });

        try {
          const dataUrl = await fileToDataUrl(file, isImage);
          const base64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
          const bytes = Math.floor(base64.length * 3 / 4);
          if (bytes > MAX_FILE_BYTES) throw new Error('terlalu besar');
          const mime = dataUrl.slice(5, dataUrl.indexOf(';')) || 'application/octet-stream';

          replaceFileBody(bubble, buyerEl.chat, {
            name: file.name,
            sizeKB: bytes / 1024,
            previewUrl: isImage ? dataUrl : '',
          });

          if (CONFIG.notifyUrl) {
            postJSON({
              action: 'buyerMessage',
              buyerId: buyer.id,
              cid,
              nama: buyerEl.name.value.trim(),
              email: buyerEl.email.value.trim(),
              file: { name: file.name, type: mime, data: base64 },
            }).catch(() => failBubble(bubble));
          } else {
            setTick(bubble, 'sent');
            queueDemoReply({ kind: 'file', name: file.name });
          }
        } catch (err) {
          failBubble(bubble);
          if (err.message === 'terlalu besar') {
            showToast('File terlalu besar (maks ' + CONFIG.maxFileMB + ' MB).', 3500);
          } else {
            showToast('File gagal dibaca. Coba file lain.', 3500);
          }
        }
      }

      // Teks tagihan dari link (?pesan=...) diambil lalu dihapus dari alamat,
      // supaya tidak terisi ulang saat halaman dimuat ulang.
      function readPresetMessage() {
        const params = new URLSearchParams(window.location.search);
        const text = (params.get('pesan') || '').trim();
        if (!text) return '';
        params.delete('pesan');
        const rest = params.toString();
        try {
          window.history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);
        } catch (err) { /* alamat tidak bisa diubah: tidak masalah */ }
        return text;
      }

      // Nama dan Gmail dari teks tagihan (baris "*Nama:*" dan "*Gmail:*").
      function parseBuyerInfo(text) {
        const nama = /nama\s*:\s*\*?\s*([^*\n]+)/i.exec(text);
        const email = /gmail\s*:\s*\*?\s*([^\s*]+@[^\s*]+)/i.exec(text);
        return {
          nama: nama ? nama[1].trim().slice(0, 40) : '',
          email: email ? email[1].trim().slice(0, 80) : '',
        };
      }

      function startBuyer() {
        buyer.id = readLocal('kujr_buyer_id') || makeId();
        saveLocal('kujr_buyer_id', buyer.id);
        buyerEl.name.value = readLocal('kujr_buyer_name');
        buyerEl.email.value = readLocal('kujr_buyer_email');
        // Dari tombol Konfirmasi di halaman pembelian (chat.html?pesan=...): nama, Gmail, dan teks tagihan langsung terisi.
        // Teks hanya masuk ke kolom pesan; pembeli tetap menekan kirim sendiri.
        const preset = readPresetMessage();
        if (preset) {
          const info = parseBuyerInfo(preset);
          if (info.nama) buyerEl.name.value = info.nama;
          if (info.email) buyerEl.email.value = info.email;
          persistBuyer();
          buyerEl.input.value = preset.slice(0, 1000);
        }

        buyerEl.adminName.textContent = CONFIG.adminName;
        document.title = 'Chat ' + CONFIG.adminName;
        setAvatar(buyerEl.avatar);
        trackScroll(buyerEl.chat);
        addBubble(buyerEl.chat, 'in', { text: CONFIG.welcomeMessage });

        if (CONFIG.notifyUrl) {
          setStatus('menghubungkan...');
          pollBuyer();
          setInterval(pollBuyer, CONFIG.buyerPollMs);
        } else {
          setStatus('mode demo');
          showToast('Mode demo: halaman belum tersambung ke server. Pesan hanya tampil di browser ini.', 5000);
        }
      }

      /* =====================================================================
         HALAMAN ADMIN (operator)
         ===================================================================== */
      function renderInbox(list) {
        adminEl.inbox.textContent = '';
        if (!list.length) {
          adminEl.inbox.appendChild(note('Belum ada pesan dari pembeli.'));
          return;
        }

        list.forEach((c) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'inbox-item';

          const avatar = document.createElement('div');
          avatar.className = 'inbox-avatar';
          avatar.textContent = initials(c.nama);

          const body = document.createElement('div');
          body.className = 'inbox-body';

          const top = document.createElement('div');
          top.className = 'inbox-top';

          const name = document.createElement('span');
          name.className = 'inbox-name';
          name.textContent = c.nama || 'Pembeli';
          if (c.needsReply) {
            const dot = document.createElement('span');
            dot.className = 'unread';
            dot.setAttribute('aria-label', 'belum dibalas');
            name.appendChild(dot);
          }

          const time = document.createElement('span');
          time.className = 'inbox-time';
          time.textContent = formatTime(c.lastTime);

          const last = document.createElement('div');
          last.className = 'inbox-last';
          last.textContent = c.lastText || '';

          top.append(name, time);
          body.append(top, last);
          item.append(avatar, body);
          item.addEventListener('click', () => openThread(c));
          adminEl.inbox.appendChild(item);
        });
      }

      async function loadInbox() {
        if (admin.inboxBusy || document.hidden) return;
        admin.inboxBusy = true;
        try {
          const res = await jsonp({ action: 'list', key: ADMIN_KEY });
          if (!res.ok) throw new Error(res.error || 'gagal');
          const sig = JSON.stringify(res.conversations);
          if (sig !== admin.inboxSig) {
            admin.inboxSig = sig;
            renderInbox(res.conversations);
          }
        } catch (err) {
          admin.inboxSig = '';
          adminEl.inbox.textContent = '';
          adminEl.inbox.appendChild(note(err.message === 'unauthorized'
            ? 'Kunci admin di link ini tidak cocok dengan ADMIN_KEY di Apps Script.'
            : 'Pesan belum bisa dimuat. Periksa koneksi, lalu tunggu sebentar.'));
        } finally {
          admin.inboxBusy = false;
        }
      }

      async function loadThread() {
        const target = admin.current;
        if (!target || admin.threadBusy || document.hidden) return;
        admin.threadBusy = true;
        try {
          const res = await jsonp({ action: 'adminThread', key: ADMIN_KEY, buyerId: target });
          if (!res.ok) throw new Error(res.error || 'gagal');
          if (admin.current !== target) return; // percakapan sudah diganti
          res.messages.forEach(applyAdminMessage);
        } catch (err) {
          if (err.message === 'unauthorized') showToast('Kunci admin tidak cocok.', 3500);
        } finally {
          admin.threadBusy = false;
        }
      }

      function applyAdminMessage(m) {
        if (admin.seen.has(m.cid)) {
          const bubble = findBubble(adminEl.chat, m.cid);
          if (bubble && m.arah === 'admin' && bubble.dataset.tick === 'pending') setTick(bubble, 'sent');
          return;
        }
        admin.seen.add(m.cid);

        if (m.arah === 'admin') {
          addBubble(adminEl.chat, 'out', { cid: m.cid, text: m.teks, time: m.waktu, tick: 'sent' });
        } else {
          addBubble(adminEl.chat, 'in', { cid: m.cid, text: m.teks, file: fileOf(m), time: m.waktu });
        }
      }

      function openThread(c) {
        admin.current = c.buyerId;
        admin.seen.clear();
        adminEl.chat.textContent = '';
        adminEl.title.textContent = c.nama || 'Pembeli';
        adminEl.sub.textContent = c.email || 'tanpa email';
        adminEl.back.hidden = false;
        adminEl.inbox.hidden = true;
        adminEl.thread.hidden = false;
        loadThread();
      }

      function closeThread() {
        admin.current = null;
        adminEl.title.textContent = 'Kotak masuk';
        adminEl.sub.textContent = CONFIG.adminName;
        adminEl.back.hidden = true;
        adminEl.thread.hidden = true;
        adminEl.inbox.hidden = false;
        admin.inboxSig = '';
        loadInbox();
      }

      function sendAdminReply() {
        const text = adminEl.input.value.trim();
        const target = admin.current;
        if (!text || !target) return;

        adminEl.input.value = '';
        const cid = makeId();
        admin.seen.add(cid);
        const bubble = addBubble(adminEl.chat, 'out', { cid, text, tick: 'pending' });
        postJSON({ action: 'adminReply', key: ADMIN_KEY, buyerId: target, cid, teks: text })
          .catch(() => failBubble(bubble));
        adminEl.input.focus();
      }

      function startAdmin() {
        document.title = 'Kotak masuk · ' + CONFIG.adminName;
        trackScroll(adminEl.chat);
        adminEl.back.addEventListener('click', closeThread);
        adminEl.form.addEventListener('submit', (e) => {
          e.preventDefault();
          sendAdminReply();
        });

        if (!CONFIG.notifyUrl) {
          adminEl.inbox.appendChild(note('Halaman ini belum tersambung ke server. Isi CONFIG.notifyUrl dengan URL Apps Script.'));
          return;
        }

        loadInbox();
        setInterval(() => { if (!admin.current) loadInbox(); }, CONFIG.adminListPollMs);
        setInterval(() => { if (admin.current) loadThread(); }, CONFIG.adminThreadPollMs);
      }

      /* =====================================================================
         EVENT HALAMAN PEMBELI
         ===================================================================== */
      buyerEl.form.addEventListener('submit', (e) => {
        e.preventDefault();
        sendText();
      });

      buyerEl.file.addEventListener('change', () => {
        const files = Array.from(buyerEl.file.files || []);
        buyerEl.file.value = ''; // agar file yang sama bisa dipilih lagi nanti
        if (!files.length) return;
        if (!requireName({ type: 'files', files })) return;
        persistBuyer();
        files.forEach((file) => { sendFile(file); });
      });

      buyerEl.name.addEventListener('change', persistBuyer);
      buyerEl.email.addEventListener('change', persistBuyer);

      buyerEl.name.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          buyerEl.email.focus();
        }
      });

      buyerEl.email.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          buyerEl.input.focus();
        }
      });

      buyerEl.dialogForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = buyerEl.dialogName.value.trim();
        if (!name) {
          buyerEl.dialogError.textContent = 'Nama wajib diisi.';
          buyerEl.dialogName.focus();
          return;
        }
        buyerEl.name.value = name;
        buyerEl.dialog.hidden = true;
        persistBuyer();

        // Kirim ulang aksi yang tadi tertahan karena nama belum ada
        const action = buyer.pending;
        buyer.pending = null;
        if (action && action.type === 'text') sendText();
        if (action && action.type === 'files') action.files.forEach((file) => { sendFile(file); });
      });

      buyerEl.dialogCancel.addEventListener('click', () => {
        const action = buyer.pending;
        buyer.pending = null;
        buyerEl.dialog.hidden = true;
        if (action && action.type === 'files') showToast('Pengiriman file dibatalkan.', 2500);
      });

      buyerEl.dialog.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') buyerEl.dialogCancel.click();
      });

      /* =====================================================================
         LAYAR HP: tetap pas saat keyboard muncul (Visual Viewport API)
         ===================================================================== */
      const mobileQuery = window.matchMedia('(max-width: 767px)');

      function syncViewport() {
        const vv = window.visualViewport;
        document.querySelectorAll('.app').forEach((app) => {
          if (!vv || !mobileQuery.matches) {
            app.style.height = '';
            app.style.transform = '';
          } else {
            app.style.height = vv.height + 'px';
            app.style.transform = 'translateY(' + vv.offsetTop + 'px)';
          }
        });
        const box = IS_ADMIN ? adminEl.chat : buyerEl.chat;
        if (box.dataset.stick === '1') box.scrollTop = box.scrollHeight;
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport);
        window.visualViewport.addEventListener('scroll', syncViewport);
      }
      window.addEventListener('resize', syncViewport);
      window.addEventListener('focusin', () => setTimeout(syncViewport, 150));

      /* =====================================================================
         START
         ===================================================================== */
      if (IS_ADMIN) {
        buyerEl.app.hidden = true;
        adminEl.app.hidden = false;
        startAdmin();
      } else {
        startBuyer();
      }
      syncViewport();
    })();
  </script>
</body>
</html>
