<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="Chat pembeli addon KUJR">
  <link rel="icon" href="data:,">
  <title>Chat admin zibon_craft74</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Atribut hidden harus selalu menang atas aturan display */
    [hidden] { display: none !important; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111b21;
      background: #efeae2;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ---------- Kerangka layar (penuh di HP) ---------- */
    .app {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      background: #efeae2;
      overflow: hidden;
    }

    /* ---------- Header hijau ---------- */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: #075e54;
      color: #fff;
      flex-shrink: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #b0bec5;
    }

    .header-info { min-width: 0; flex: 1; }

    .admin-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #25d366;
    }

    /* ---------- Bar identitas pembeli ---------- */
    .buyer-bar {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      background: #f0f2f5;
      border-bottom: 1px solid #d1d7db;
      flex-shrink: 0;
    }

    .buyer-bar input {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px; /* 16px mencegah zoom otomatis di iPhone */
      outline: none;
    }

    .buyer-bar input:focus {
      border-color: #00a884;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
    }

    /* ---------- Area chat ---------- */
    .chat-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 10px 12px 14px;
      background-color: #efeae2;
      background-image: radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .date-pill {
      display: table;
      margin: 4px auto 8px;
      padding: 5px 12px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
      font-size: 12.5px;
      color: #54656f;
      text-transform: uppercase;
    }

    .msg-row {
      display: flex;
      margin-top: 8px;
      animation: pop 0.18s ease-out;
    }

    .msg-row.grouped { margin-top: 2px; }

    .msg-row.in  { justify-content: flex-start; }
    .msg-row.out { justify-content: flex-end; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- Balon pesan ---------- */
    .bubble {
      position: relative;
      display: flow-root;
      max-width: 80%;
      padding: 6px 8px 6px 9px;
      border-radius: 8px;
      font-size: 14.2px;
      line-height: 1.35;
      color: #111b21;
      overflow-wrap: anywhere;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
    }

    .bubble.in  { background: #ffffff; border-top-left-radius: 0; }
    .bubble.out { background: #dcf8c6; border-top-right-radius: 0; }
    .bubble.file { min-width: 210px; }

    .bubble.in.grouped  { border-top-left-radius: 8px; }
    .bubble.out.grouped { border-top-right-radius: 8px; }

    .bubble.in::before,
    .bubble.out::after {
      content: "";
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .bubble.in::before {
      left: -8px;
      border-width: 0 8px 8px 0;
      border-color: transparent #ffffff transparent transparent;
    }

    .bubble.out::after {
      right: -8px;
      border-width: 0 0 8px 8px;
      border-color: transparent transparent transparent #dcf8c6;
    }

    .bubble.grouped::before,
    .bubble.grouped::after { display: none; }

    .msg-text { white-space: pre-line; }

    /* Tombol unduhan di dalam balon (dipakai setelah bukti valid) */
    .bubble-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 16px;
      background: #075e54;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
    }

    .meta {
      float: right;
      display: flex;
      align-items: center;
      gap: 3px;
      margin: 4px 0 0 10px;
      font-size: 11px;
      line-height: 1;
      color: #667781;
    }

    .ticks { font-size: 12px; letter-spacing: -2px; color: #8696a0; }
    .ticks.read { color: #53bdeb; }
    .ticks.failed { color: #d93025; letter-spacing: 0; }

    /* ---------- Isi file ---------- */
    .file-wrap { min-width: 0; }

    .file-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .thumb {
      display: block;
      max-width: 100%;
      max-height: 280px;
      height: auto;
      border-radius: 6px;
      background: #d9d9d9;
    }

    .file-caption {
      margin-top: 4px;
      font-size: 12px;
      color: #667781;
      overflow-wrap: anywhere;
    }

    .file-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #f0f2f5;
      font-size: 22px;
    }

    .file-info { min-width: 0; flex: 1; }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .file-size {
      margin-top: 2px;
      font-size: 12px;
      color: #667781;
    }

    /* ---------- Kolom ketik: lampiran · teks · kirim ---------- */
    .composer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: #f0f2f5;
      flex-shrink: 0;
    }

    .attach-wrap {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .attach-btn {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Input file transparan menutupi ikon, supaya pemilih file HP terbuka dari sentuhan pengguna */
    .file-input {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
      font-size: 0;
    }

    .attach-wrap:hover .attach-btn  { background: rgba(0, 0, 0, 0.06); }
    .attach-wrap:active .attach-btn { background: rgba(0, 0, 0, 0.12); }

    .attach-wrap:has(.file-input:focus-visible) .attach-btn {
      outline: 2px solid #00a884;
      outline-offset: 2px;
    }

    .msg-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 16px;
      border: none;
      border-radius: 21px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .msg-input:focus { box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.25); }

    .send-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:active { transform: scale(0.95); }

    /* ---------- Notifikasi kecil ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(76px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 9px 14px;
      border-radius: 8px;
      background: rgba(17, 27, 33, 0.92);
      color: #fff;
      font-size: 13.5px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
    }

    /* ---------- Dialog nama pembeli ---------- */
    .dialog-overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(11, 20, 26, 0.45);
    }

    .dialog {
      width: 100%;
      max-width: 340px;
      padding: 20px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .dialog-title {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 600;
      color: #111b21;
    }

    .dialog-text {
      margin: 0 0 14px;
      font-size: 13.5px;
      line-height: 1.4;
      color: #54656f;
    }

    .dialog-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .dialog-input:focus {
      border-color: #00a884;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
    }

    .dialog-error {
      min-height: 18px;
      margin-top: 6px;
      font-size: 12.5px;
      color: #d93025;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost   { background: transparent; color: #00a884; }
    .btn-primary { background: #00a884; color: #fff; }

    /* ---------- Desktop: tampilan kartu di tengah layar ---------- */
    @media (min-width: 768px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2vh 0;
        background: #d1d7db;
      }

      .app {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        left: auto;
        width: 100%;
        max-width: 960px;
        height: 96vh;
        max-height: 900px;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(11, 20, 26, 0.25);
      }

      .bubble { max-width: 62%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg-row { animation: none; }
    }

    /* ---------- Kartu QR DANA (muncul setelah pesanan dikirim) ---------- */
    .dana-card {
      margin-top: 8px;
      padding: 12px 10px 10px;
      border-radius: 8px;
      background: #f0faf5;
      text-align: center;
    }

    .dana-amount { margin-bottom: 8px; font-size: 15px; font-weight: 700; color: #075e54; }

    .dana-qr {
      display: block;
      width: 100%;
      max-width: 230px;
      height: auto;
      margin: 0 auto;
      border-radius: 6px;
      background: #ffffff;
    }

    .dana-number { margin-top: 10px; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }

    .dana-hint { margin-top: 2px; font-size: 12.5px; color: #667781; }

    .dana-copy {
      margin-top: 8px;
      padding: 7px 16px;
      border: 0;
      border-radius: 16px;
      background: #075e54;
      color: #ffffff;
      font: inherit;
      font-size: 13.5px;
      cursor: pointer;
    }
    /* ---------- Tombol unduh dari balasan otomatis ---------- */
    .btn-unduh { display: block; margin-top: 8px; padding: 9px 12px; border-radius: 16px; background: #075e54; color: #fff; text-align: center; font-weight: 700; text-decoration: none; }
    #buyerApp[hidden] { display: none !important; }
    /* ---------- Panel admin ---------- */
    .adm { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #efeae2; font-size: 15px; }
    .adm-head { display: flex; justify-content: space-between; gap: 8px; padding: 12px 16px; background: #075e54; color: #fff; font-weight: 700; }
    .adm-list { max-height: 34vh; overflow: auto; background: #fff; border-bottom: 1px solid #d1d7db; }
    .adm-item { padding: 10px 14px; border-bottom: 1px solid #eef1f3; cursor: pointer; }
    .adm-item.on { background: #f0f2f5; }
    .adm-item strong, .adm-item small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .adm-item small { color: #667781; }
    .adm-chat { flex: 1; overflow: auto; padding: 12px; }
    .adm-form { display: flex; gap: 8px; padding: 8px; background: #f0f2f5; }
    .adm-form input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid #d1d7db; border-radius: 18px; font: inherit; }
    .adm-form button { padding: 10px 16px; border: 0; border-radius: 18px; background: #075e54; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .aksi-admin { display: flex; gap: 8px; margin-top: 8px; }
    .aksi-admin button { flex: 1; border: 0; border-radius: 16px; padding: 8px 6px; color: #fff; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
    .aksi-admin .lanjut { background: #15803d; }
    .aksi-admin .tolak { background: #b91c1c; }
    .status-admin { margin-top: 8px; font-size: 13px; color: #667781; }
  </style>
</head>
<body>

  <!-- ===================== HALAMAN CHAT PEMBELI ===================== -->
  <div class="app" id="buyerApp">
    <header class="chat-header">
      <img class="avatar" id="adminAvatar" alt="Foto profil admin" width="40" height="40">
      <div class="header-info">
        <div class="admin-name" id="adminName">admin zibon_craft74</div>
        <div class="admin-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">online</span>
        </div>
      </div>
    </header>

    <!-- Identitas pembeli: nama wajib, email opsional -->
    <section class="buyer-bar" aria-label="Data pembeli">
      <input type="text" id="buyerName" placeholder="Nama Anda *" maxlength="40" autocomplete="name" enterkeyhint="next">
      <input type="email" id="buyerEmail" placeholder="Email (opsional)" maxlength="80" autocomplete="email" enterkeyhint="done">
    </section>

    <div class="chat-body" id="chatBody" role="log" aria-live="polite">
      <div class="date-pill">Hari ini</div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="attach-wrap">
        <label for="fileInput" class="attach-btn" title="Kirim bukti pembayaran atau file">
          <span aria-hidden="true">📎</span>
        </label>
        <input type="file" id="fileInput" class="file-input" accept="*/*" aria-label="Lampirkan file">
      </div>

      <input type="text" class="msg-input" id="messageInput" placeholder="Ketik pesan" maxlength="1000" autocomplete="off" enterkeyhint="send">

      <button type="submit" class="send-btn" aria-label="Kirim pesan">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </form>

    <!-- Dialog nama: muncul jika pembeli mengirim sesuatu tanpa mengisi nama -->
    <div class="dialog-overlay" id="nameDialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <form id="dialogForm" autocomplete="off">
          <h2 class="dialog-title" id="dialogTitle">Isi nama Anda</h2>
          <p class="dialog-text">Nama diperlukan sebelum mengirim pesan atau bukti pembayaran.</p>
          <input type="text" id="dialogName" class="dialog-input" placeholder="Nama Anda" maxlength="40" autocomplete="name">
          <div class="dialog-error" id="dialogError" role="alert"></div>
          <div class="dialog-actions">
            <button type="button" class="btn btn-ghost" id="dialogCancel">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      /* =====================================================================
         KONSTANTA & STATE
         ===================================================================== */
      const MIN = 60 * 1000;
      const HOUR = 60 * MIN;
      const WIB_OFFSET = 7 * HOUR;              // Asia/Jakarta = UTC+7
      const MAX_FILE_BYTES = CONFIG.maxFileMB * 1024 * 1024;
      const COMPRESS_OVER_BYTES = 1024 * 1024;  // gambar di atas 1 MB dikecilkan dulu sebelum dikirim
      const COMPRESS_MAX_SIDE = 1600;
      const STICK_PX = 60;
      const JSONP_TIMEOUT_MS = 15000;
      const ADMIN_MODE = new URLSearchParams(window.location.search).get('mode') === 'admin';
      const IMAGE_EXT_RE = /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i;
      const BULAN = {
        jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, agt: 8, aug: 8, ags: 8,
        sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12,
      };
      const PROOF_TOTAL_RE = /total\s*transfer\s*:?\s*\*?\s*(Rp\s?[\d.,]+)/i;
      const PROOF_INVOICE_RE = /no\.?\s*invoice\s*:?\s*\*?\s*([A-Za-z0-9-]+)/i;
      const SIZE_FORMAT = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1 });
      const DAY_FORMAT = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' });
      const TICKS = {
        pending: { text: '✓', cls: 'ticks' },
        sent: { text: '✓✓', cls: 'ticks' },
        read: { text: '✓✓', cls: 'ticks read' },
        failed: { text: '!', cls: 'ticks failed' },
      };
      const DEFAULT_AVATAR =
        'data:image/svg+xml;charset=utf-8,' +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
          '<rect width="100" height="100" fill="#b0bec5"/>' +
          '<circle cx="50" cy="38" r="18" fill="#ffffff"/>' +
          '<path d="M20 92c3-22 15-32 30-32s27 10 30 32z" fill="#ffffff"/>' +
          '</svg>'
        );

      const buyer = { id: '', seen: new Set(), pending: null, polling: false };
      const state = { order: null };   // data pesanan yang sedang berlaku
      let toastTimer = null;
      let jsonpCount = 0;
      let ocrLoading = null;

      /* =====================================================================
         ELEMEN HALAMAN
         ===================================================================== */
      const $ = (id) => document.getElementById(id);
      const toastEl = $('toast');

      const buyerEl = {
        app: $('buyerApp'),
        avatar: $('adminAvatar'),
        adminName: $('adminName'),
        status: $('statusText'),
        name: $('buyerName'),
        email: $('buyerEmail'),
        chat: $('chatBody'),
        form: $('composer'),
        input: $('messageInput'),
        file: $('fileInput'),
        dialog: $('nameDialog'),
        dialogForm: $('dialogForm'),
        dialogName: $('dialogName'),
        dialogError: $('dialogError'),
        dialogCancel: $('dialogCancel'),
      };

      /* =====================================================================
         UTILITAS
         ===================================================================== */
      const pad = (n) => String(n).padStart(2, '0');

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      }

      function saveLocal(key, value) {
        try { localStorage.setItem(key, value); } catch (err) { /* penyimpanan diblokir: lewati */ }
      }

      function readLocal(key) {
        try { return localStorage.getItem(key) || ''; } catch (err) { return ''; }
      }

      function formatTime(value) {
        const d = value ? new Date(value) : new Date();
        if (Number.isNaN(d.getTime())) return formatTime();
        return pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      function formatKB(kb) {
        return SIZE_FORMAT.format(kb) + ' KB';
      }

      function rupiah(n) {
        return 'Rp' + Number(n).toLocaleString('id-ID');
      }

      // "Rp25.094" atau "1.500" -> 25094 atau 1500. Desimal ",00" di belakang diabaikan.
      function toAmount(s) {
        const n = parseInt(String(s).replace(/,\d{2}$/, '').replace(/\D/g, ''), 10);
        return Number.isFinite(n) && n > 0 ? n : null;
      }

      function isImageFile(file) {
        return (file.type || '').indexOf('image/') === 0 || IMAGE_EXT_RE.test(file.name);
      }

      function showToast(message, ms) {
        toastEl.textContent = message;
        toastEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms || 2600);
      }

      function setAvatar(img) {
        img.addEventListener('error', () => {
          if (img.dataset.fallback) return;
          img.dataset.fallback = '1';
          img.src = DEFAULT_AVATAR;
        });
        img.src = CONFIG.avatarUrl || DEFAULT_AVATAR;
      }

      function setStatus(text) {
        buyerEl.status.textContent = text;
      }

      /* =====================================================================
         SCROLL OTOMATIS
         ===================================================================== */
      function trackScroll(box) {
        box.dataset.stick = '1';
        box.addEventListener('scroll', () => {
          const gap = box.scrollHeight - box.scrollTop - box.clientHeight;
          box.dataset.stick = gap <= STICK_PX ? '1' : '0';
        }, { passive: true });
      }

      function scrollDown(box, force) {
        if (force || box.dataset.stick === '1') box.scrollTop = box.scrollHeight;
      }

      function keepInView(box, row) {
        scrollDown(box, row === box.lastElementChild);
      }

         GELEMBUNG PESAN
         ===================================================================== */
      function setTick(bubble, state) {
        const tick = bubble.querySelector('.ticks');
        if (!tick) return;
        const t = TICKS[state] || TICKS.pending;
        tick.textContent = t.text;
        tick.className = t.cls;
        bubble.dataset.tick = state;
      }

      function findBubble(box, cid) {
        return box.querySelector('.bubble[data-cid="' + CSS.escape(cid) + '"]');
      }

      function failBubble(bubble) {
        setTick(bubble, 'failed');
        showToast('Gagal mengirim. Periksa koneksi lalu coba lagi.');
      }

      function markSentAsRead(box) {
        box.querySelectorAll('.bubble.out').forEach((b) => {
          if (b.dataset.tick === 'sent') setTick(b, 'read');
        });
      }

      // Data file dari server (kolom Sheet) menjadi bentuk yang dipakai balon
      function fileOf(m) {
        if (!m.fileNama) return null;
        const link = typeof m.fileLink === 'string' && /^https?:\/\//i.test(m.fileLink) ? m.fileLink : '';
        return { name: m.fileNama, sizeKB: Number(m.fileKB) || 0, link };
      }

      function fileCard(file) {
        const card = document.createElement('div');
        card.className = 'file-card';

        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.textContent = file.previewUrl ? '🖼️' : '📦';

        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = file.name;

        const size = document.createElement('div');
        size.className = 'file-size';
        size.textContent = file.sub || formatKB(file.sizeKB);

        info.append(name, size);
        card.append(icon, info);
        return card;
      }

      function fileBody(file) {
        if (!file.previewUrl) {
          const card = fileCard(file);
          if (!file.link) return card;
          const a = document.createElement('a');
          a.className = 'file-link';
          a.href = file.link;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.appendChild(card);
          return a;
        }

        const wrap = document.createElement('div');
        wrap.className = 'file-wrap';

        const img = document.createElement('img');
        img.className = 'thumb';
        img.alt = file.name;
        img.src = file.previewUrl;
        // Format yang tidak bisa ditampilkan browser (mis. HEIC): tampilkan kartu file saja
        img.onerror = () => wrap.replaceChildren(fileCard(Object.assign({}, file, { previewUrl: '' })));

        const caption = document.createElement('div');
        caption.className = 'file-caption';
        caption.textContent = file.name + ' · ' + formatKB(file.sizeKB);

        wrap.append(img, caption);
        return wrap;
      }

      function replaceFileBody(bubble, box, file) {
        const old = bubble.querySelector('.file-wrap, .file-card, .file-link');
        const body = fileBody(file);
        const img = body.querySelector('img');
        if (img) img.addEventListener('load', () => keepInView(box, bubble.parentElement));
        if (old) old.replaceWith(body);
        else bubble.insertBefore(body, bubble.firstChild);
      }

      // Teks dengan format WhatsApp (*tebal*). Memakai DOM, bukan innerHTML, agar aman.
      function fillText(node, teks) {
        String(teks).split('\n').forEach((baris, i) => {
          if (i > 0) node.appendChild(document.createElement('br'));
          baris.split(/(\*[^*\n]+\*)/).forEach((bagian) => {
            if (!bagian) return;
            if (/^\*[^*\n]+\*$/.test(bagian)) {
              const tebal = document.createElement('strong');
              tebal.textContent = bagian.slice(1, -1);
              node.appendChild(tebal);
            } else {
              node.appendChild(document.createTextNode(bagian));
            }
          });
        });
        return node;
      }

      // Menambah satu balon. side = 'in' (admin/sistem) atau 'out' (pembeli).
      // o.link = { url, label } menampilkan tombol unduhan di dalam balon.
      function addBubble(box, side, o) {
        const prev = box.lastElementChild;
        const grouped = !!prev && prev.classList.contains('msg-row') && prev.classList.contains(side);

        const row = document.createElement('div');
        row.className = 'msg-row ' + side + (grouped ? ' grouped' : '');

        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + side + (o.file ? ' file' : '') + (grouped ? ' grouped' : '');
        if (o.cid) bubble.dataset.cid = o.cid;

        if (o.file) {
          const body = fileBody(o.file);
          const img = body.querySelector('img');
          if (img) img.addEventListener('load', () => keepInView(box, row));
          bubble.appendChild(body);
        }

        if (o.text) {
          const text = document.createElement('div');
          text.className = 'msg-text';
          fillText(text, o.text);
          bubble.appendChild(text);
        }

        if (o.link) {
          const a = document.createElement('a');
          a.className = 'bubble-link';
          a.href = o.link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = o.link.label;
          bubble.appendChild(a);
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        const time = document.createElement('span');
        time.textContent = formatTime(o.time);
        meta.appendChild(time);
        if (side === 'out') {
          const tick = document.createElement('span');
          tick.className = 'ticks';
          meta.appendChild(tick);
        }
        bubble.appendChild(meta);

        row.appendChild(bubble);
        box.appendChild(row);
        if (side === 'out') setTick(bubble, o.tick || 'pending');
        scrollDown(box, true);
        return bubble;
      }

      /* =====================================================================
         KARTU QR DANA
         ===================================================================== */
      function addDanaCard(box, proof) {
        const bubble = addBubble(box, 'in', {
          text: 'Silakan bayar lewat DANA sesuai nominal di bawah ini. Setelah bayar, kirim screenshot bukti transaksi terbaru di chat ini.',
        });

        const card = document.createElement('div');
        card.className = 'dana-card';

        if (proof.total) {
          const amount = document.createElement('div');
          amount.className = 'dana-amount';
          amount.textContent = 'Transfer persis ' + rupiah(proof.total);
          card.appendChild(amount);
        }

        const qr = document.createElement('img');
        qr.className = 'dana-qr';
        qr.alt = 'Kode QR DANA ' + CONFIG.danaNumber;
        qr.src = CONFIG.qrUrl;
        qr.addEventListener('load', () => keepInView(box, bubble.parentElement));
        qr.addEventListener('error', () => qr.remove()); // QR belum ada: nomor tetap tampil

        const number = document.createElement('div');
        number.className = 'dana-number';
        number.textContent = CONFIG.danaNumber;

        const hint = document.createElement('div');
        hint.className = 'dana-hint';
        hint.textContent = 'Cuma bisa dibayar pakai DANA' + (proof.invoice ? ' · ' + proof.invoice : '');

        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'dana-copy';
        copy.textContent = 'Salin nomor';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(CONFIG.danaNumber);
            showToast('Nomor DANA disalin.');
          } catch (err) {
            showToast('Gagal menyalin. Salin nomornya secara manual.', 3500);
          }
        });

        card.append(qr, number, hint, copy);
        bubble.insertBefore(card, bubble.querySelector('.meta'));
        keepInView(box, bubble.parentElement);
      }

      // Teks tagihan dari pesan pembeli -> { total, invoice } (atau null jika bukan tagihan)
      function parseProof(text) {
        if (!text) return null;
        const t = PROOF_TOTAL_RE.exec(text);
        const i = PROOF_INVOICE_RE.exec(text);
        if (!t && !i) return null;
        return { total: t ? toAmount(t[1]) || 0 : 0, invoice: i ? i[1] : '' };
      }

      /* =====================================================================
         DATA PESANAN
         ===================================================================== */
      // Mengambil isi baris "*Label:* isi" dari teks pesan
      function fieldOf(teks, label) {
        const m = new RegExp('\\*' + label + ':\\*[ \\t]*([^\\n]*)', 'i').exec(teks);
        return m ? m[1].trim() : '';
      }

      // Teks pesan dari index.html -> data pesanan. Teksnya tetap disalin apa adanya ke chat.
      function parseOrder(teks) {
        const bukti = parseProof(teks) || { total: 0, invoice: '' };
        return {
          text: teks.trim(),
          nama: fieldOf(teks, 'Nama').slice(0, 40),
          gmail: fieldOf(teks, 'Gmail').slice(0, 80),
          harga: toAmount(fieldOf(teks, 'Harga')) || 0,
          total: bukti.total,
          invoice: bukti.invoice,
        };
      }

      // Membaca teks tagihan dari alamat (?pesan=...) yang dikirim tombol Konfirmasi di index.html.
      // Alamat dibersihkan setelahnya, supaya pesan tidak terkirim dua kali saat halaman dimuat ulang.
      function readOrderFromUrl() {
        const p = new URLSearchParams(window.location.search);
        const teks = p.get('pesan');
        if (!teks) return null;

        p.delete('pesan');
        const rest = p.toString();
        try {
          history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);
        } catch (err) { /* alamat tidak bisa diubah: lewati */ }
        return parseOrder(teks);
      }

      function loadSavedOrder() {
        try { return JSON.parse(readLocal('kujr_order') || 'null'); } catch (err) { return null; }
      }

      function saveOrder(o) {
        saveLocal('kujr_order', JSON.stringify(o));
      }

      // Teks pesan dari index.html langsung disalin sebagai pesan pertama pembeli, lalu kartu QR DANA muncul
      function sendOrder(o) {
        const cid = makeId();
        buyer.seen.add(cid);
        const bubble = addBubble(buyerEl.chat, 'out', { cid, text: o.text, tick: 'pending' });
        simpanPesan(buyer.id, { cid, arah: 'pembeli', teks: o.text, waktu: new Date().toISOString() });

        if (CONFIG.notifyUrl) {
          postJSON({
            action: 'buyerMessage',
            buyerId: buyer.id,
            cid,
            nama: o.nama || buyerEl.name.value.trim(),
            email: o.gmail || buyerEl.email.value.trim(),
            teks: o.text,
          }).catch(() => failBubble(bubble));
        } else {
          setTick(bubble, 'sent');
        }

        addDanaCard(buyerEl.chat, { total: o.total, invoice: o.invoice });
      }

      /* =====================================================================
         JARINGAN
         ===================================================================== */
      function jsonp(params) {
        return new Promise((resolve, reject) => {
          const cb = 'kujrChatCb' + (++jsonpCount) + '_' + Date.now();
          const query = new URLSearchParams(params);
          query.set('callback', cb);

          const script = document.createElement('script');
          const timer = setTimeout(() => finish(new Error('timeout')), JSONP_TIMEOUT_MS);

          function finish(err, data) {
            clearTimeout(timer);
            window[cb] = () => {};
            script.remove();
            if (err) reject(err);
            else resolve(data);
          }

          window[cb] = (data) => finish(null, data);
          script.onerror = () => finish(new Error('network'));
          script.src = CONFIG.notifyUrl + (CONFIG.notifyUrl.indexOf('?') === -1 ? '?' : '&') + query.toString();
          document.head.appendChild(script);
        });
      }

      function postJSON(body) {
        return fetch(CONFIG.notifyUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(body),
        });
      }

      function applyBuyerMessage(m) {
        if (buyer.seen.has(m.cid)) {
          const bubble = findBubble(buyerEl.chat, m.cid);
          if (bubble && m.arah === 'pembeli' && bubble.dataset.tick === 'pending') setTick(bubble, 'sent');
          return;
        }
        buyer.seen.add(m.cid);

        if (m.arah === 'pembeli') {
          addBubble(buyerEl.chat, 'out', { cid: m.cid, text: m.teks, file: fileOf(m), time: m.waktu, tick: 'sent' });
          const proof = parseProof(m.teks || '');
          if (proof) addDanaCard(buyerEl.chat, proof);
        } else {
          addBubble(buyerEl.chat, 'in', { cid: m.cid, text: m.teks, file: fileOf(m), time: m.waktu });
          markSentAsRead(buyerEl.chat);
        }
      }

      async function pollBuyer() {
        if (buyer.polling || document.hidden) return;
        buyer.polling = true;
        try {
          const res = await jsonp({ action: 'thread', buyerId: buyer.id });
          if (!res.ok) throw new Error(res.error || 'gagal');
          setStatus('online');
          res.messages.forEach(applyBuyerMessage);
        } catch (err) {
          setStatus('tidak terhubung');
        } finally {
          buyer.polling = false;
        }
      }

      /* =====================================================================
         FILE: BACA DAN KECILKAN GAMBAR (untuk dikirim ke admin)
         ===================================================================== */
      function readAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('baca gagal'));
          reader.readAsDataURL(file);
        });
      }

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            const scale = Math.min(1, COMPRESS_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('decode gagal'));
          };
          img.src = url;
        });
      }

      async function fileToDataUrl(file, isImage) {
        if (isImage && file.size > COMPRESS_OVER_BYTES) {
          try {
            return await compressImage(file);
          } catch (err) {
            // gagal dikecilkan: pakai file asli
          }
        }
        return readAsDataUrl(file);
      }

      // Mengirim lampiran ke admin, lalu (untuk gambar) memeriksa isi bukti
      async function handleUpload(file) {
        const isImage = isImageFile(file);
        let previewData = '';
        if (!isImage && file.size > MAX_FILE_BYTES) {
          showToast('File terlalu besar. Maksimal ' + CONFIG.maxFileMB + ' MB.', 3500);
          return;
        }

        const cid = makeId();
        buyer.seen.add(cid);
        const bubble = addBubble(buyerEl.chat, 'out', {
          cid,
          file: { name: file.name, sizeKB: file.size / 1024, sub: 'Memproses...' },
          tick: 'pending',
        });

        try {
          const dataUrl = await fileToDataUrl(file, isImage);
          previewData = isImage ? dataUrl : '';
          const base64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
          const bytes = Math.floor(base64.length * 3 / 4);
          if (bytes > MAX_FILE_BYTES) throw new Error('terlalu besar');
          const mime = dataUrl.slice(5, dataUrl.indexOf(';')) || 'application/octet-stream';

          replaceFileBody(bubble, buyerEl.chat, {
            name: file.name,
            sizeKB: bytes / 1024,
            previewUrl: isImage ? dataUrl : '',
          });

          if (CONFIG.notifyUrl) {
            postJSON({
              action: 'buyerMessage',
              buyerId: buyer.id,
              cid,
              nama: buyerEl.name.value.trim(),
              email: buyerEl.email.value.trim(),
              file: { name: file.name, type: mime, data: base64 },
            }).catch(() => failBubble(bubble));
          } else {
            setTick(bubble, 'sent');
          }
        } catch (err) {
          failBubble(bubble);
          showToast(err.message === 'terlalu besar'
            ? 'File terlalu besar (maks ' + CONFIG.maxFileMB + ' MB).'
            : 'File gagal dibaca. Coba file lain.', 3500);
          return;
        }

        // Tidak ada pemeriksaan otomatis: admin memverifikasi bukti di panel admin
        simpanPesan(buyer.id, { cid, arah: 'pembeli', fileNama: file.name, fileKB: Math.round(file.size / 1024), previewUrl: previewData, waktu: new Date().toISOString() });
        botKirim(isImage ? CONFIG.msg.buktiDiterima : CONFIG.msg.fileDiterima);
      }

         ===================================================================== */
      /* =====================================================================
         PENYIMPANAN BERSAMA (localStorage): pesan pembeli, balasan bot, dan
         keputusan admin. Dipakai mode pembeli dan mode admin di browser ini.
         ===================================================================== */
      const STORE_KEY = 'kujr_store_v1';

      function storeBaca() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { threads: {} }; }
        catch (err) { return { threads: {} }; }
      }

      function storeTulis(data) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
        catch (err) { showToast('Penyimpanan browser penuh. Bukti foto berikutnya mungkin tidak tersimpan.', 4500); }
      }

      function simpanPesan(threadId, msg) {
        const data = storeBaca();
        const t = data.threads[threadId] || (data.threads[threadId] = { id: threadId, msgs: [] });
        if (msg.arah === 'pembeli') {
          t.nama = buyerEl.name.value.trim() || t.nama || 'Pembeli';
          t.email = buyerEl.email.value.trim() || t.email || '';
        }
        t.msgs.push(msg);
        t.updated = Date.now();
        storeTulis(data);
      }

      function ubahPesan(threadId, cid, patch) {
        const data = storeBaca();
        const t = data.threads[threadId];
        const m = t && t.msgs.find((x) => x.cid === cid);
        if (m) { Object.assign(m, patch); storeTulis(data); }
      }

      /* =====================================================================
         KODE OTP HARIAN: 5 digit, berganti setiap hari (WIB). Dihitung berurutan
         dari OTP_START, sehingga kode hari ini selalu beda dari kemarin dan besok.
         ===================================================================== */
      const OTP_SEED = 'kujr-otp-v1';
      const OTP_START = Math.floor((Date.UTC(2026, 0, 1) + WIB_OFFSET) / (24 * HOUR));

      function hariWib(ms) { return Math.floor((ms + WIB_OFFSET) / (24 * HOUR)); }

      function otpMix(n) {
        let x = n >>> 0;
        for (const ch of OTP_SEED) x = Math.imul(x ^ ch.charCodeAt(0), 0x85ebca6b) >>> 0;
        x ^= x >>> 13;
        x = Math.imul(x, 0xc2b2ae35) >>> 0;
        x ^= x >>> 16;
        return x >>> 0;
      }

      function otpUntukHari(n) {
        let prev = -1;
        let kode = 0;
        for (let d = OTP_START; d <= n; d++) {
          kode = otpMix(d) % 100000;
          if (kode === prev) kode = (kode + 1) % 100000;
          prev = kode;
        }
        return String(kode).padStart(5, '0');
      }

      function otpHariIni() { return otpUntukHari(hariWib(Date.now())); }

      /* ---------- Balasan bot & admin di layar pembeli ---------- */
      function tampilBalasan(m) {
        const opt = { cid: m.cid, file: null, time: m.waktu };
        if (m.teks) opt.text = m.teks;
        const bubble = addBubble(buyerEl.chat, 'in', opt);
        if (m.link) {
          const a = document.createElement('a');
          a.className = 'btn-unduh';
          a.href = m.link.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = m.link.label;
          bubble.insertBefore(a, bubble.querySelector('.meta'));
        }
        markSentAsRead(buyerEl.chat);
      }

      function botKirim(teks, link) {
        const m = { cid: makeId(), arah: 'bot', teks, link: link || null, waktu: new Date().toISOString() };
        buyer.seen.add(m.cid);
        simpanPesan(buyer.id, m);
        tampilBalasan(m);
      }

      function syncPembeli() {
        const t = storeBaca().threads[buyer.id];
        if (!t) return;
        t.msgs.forEach((m) => {
          if (m.arah === 'pembeli' || buyer.seen.has(m.cid)) return;
          buyer.seen.add(m.cid);
          tampilBalasan(m);
        });
      }

      /* =====================================================================
         PANEL ADMIN (buka dengan ?mode=admin di browser yang sama)
         ===================================================================== */
      const adm = { current: null, counts: null, sig: '', audio: null };

      function bunyi() {
        try {
          adm.audio = adm.audio || new (window.AudioContext || window.webkitAudioContext)();
          [0, 0.25].forEach((t) => {
            const osc = adm.audio.createOscillator();
            const gain = adm.audio.createGain();
            osc.frequency.value = 880;
            gain.gain.value = 0.15;
            osc.connect(gain);
            gain.connect(adm.audio.destination);
            osc.start(adm.audio.currentTime + t);
            osc.stop(adm.audio.currentTime + t + 0.18);
          });
        } catch (err) { /* browser tanpa suara: notifikasi teks tetap tampil */ }
      }

      function putuskan(threadId, cid, lanjut) {
        const teks = lanjut ? CONFIG.msg.lanjut.replace('{OTP}', otpHariIni()) : CONFIG.msg.tolak;
        simpanPesan(threadId, { cid: makeId(), arah: 'admin', teks, waktu: new Date().toISOString() });
        ubahPesan(threadId, cid, { keputusan: lanjut ? 'lanjut' : 'tolak' });
        adm.sig = '';
        admRefresh();
      }

      function renderThread(t) {
        const chatEl = $('admChat');
        chatEl.textContent = '';
        if (!t) return;
        t.msgs.forEach((m) => {
          if (m.arah === 'admin') {
            addBubble(chatEl, 'out', { cid: m.cid, text: m.teks, time: m.waktu });
            return;
          }
          const opt = { cid: m.cid, time: m.waktu };
          if (m.teks) opt.text = m.teks;
          if (m.fileNama) opt.file = { name: m.fileNama, sizeKB: m.fileKB || 0, previewUrl: m.previewUrl || '' };
          const bubble = addBubble(chatEl, 'in', opt);
          if (m.arah === 'pembeli' && m.previewUrl) {
            const aksi = document.createElement('div');
            if (m.keputusan) {
              aksi.className = 'status-admin';
              aksi.textContent = m.keputusan === 'lanjut' ? '✅ Dilanjutkan, kode OTP sudah dikirim' : '⛔ Ditolak';
            } else {
              aksi.className = 'aksi-admin';
              const ya = document.createElement('button');
              ya.type = 'button';
              ya.className = 'lanjut';
              ya.textContent = '🟢 Lanjutkan';
              ya.addEventListener('click', () => putuskan(t.id, m.cid, true));
              const tidak = document.createElement('button');
              tidak.type = 'button';
              tidak.className = 'tolak';
              tidak.textContent = '🔴 Jangan Lanjutkan';
              tidak.addEventListener('click', () => putuskan(t.id, m.cid, false));
              aksi.append(ya, tidak);
            }
            bubble.insertBefore(aksi, bubble.querySelector('.meta'));
          }
        });
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function admRefresh() {
        const data = storeBaca();
        const threads = Object.values(data.threads).sort((a, b) => (b.updated || 0) - (a.updated || 0));

        // Notifikasi: ada pesan atau bukti baru dari pembeli
        const counts = {};
        let adaBaru = false;
        threads.forEach((t) => {
          const n = t.msgs.filter((m) => m.arah === 'pembeli').length;
          counts[t.id] = n;
          if (adm.counts && n > (adm.counts[t.id] || 0)) adaBaru = true;
        });
        if (adaBaru) { bunyi(); showToast('Ada pesan atau bukti baru dari pembeli.', 3500); }
        adm.counts = counts;

        if (!adm.current && threads.length) {
          adm.current = threads[0].id;
          $('admForm').hidden = false;
        }

        // Daftar pembeli
        const listEl = $('admList');
        listEl.textContent = '';
        threads.forEach((t) => {
          const last = t.msgs[t.msgs.length - 1] || {};
          const item = document.createElement('div');
          item.className = 'adm-item' + (t.id === adm.current ? ' on' : '');
          const judul = document.createElement('strong');
          judul.textContent = t.nama || 'Pembeli';
          const isi = document.createElement('small');
          isi.textContent = last.teks || ('📎 ' + (last.fileNama || 'file'));
          item.append(judul, isi);
          item.addEventListener('click', () => {
            adm.current = t.id;
            adm.sig = '';
            $('admForm').hidden = false;
            admRefresh();
          });
          listEl.appendChild(item);
        });

        // Percakapan terpilih, digambar ulang hanya jika ada perubahan
        const t = adm.current && data.threads[adm.current];
        const sig = t ? t.msgs.map((m) => m.cid + (m.keputusan || '')).join('|') : '';
        if (sig !== adm.sig) { adm.sig = sig; renderThread(t); }
        $('admInfo').textContent = threads.length + ' pembeli';
      }

      function startAdmin() {
        buyerEl.app.hidden = true;
        const wrap = document.createElement('div');
        wrap.className = 'adm';
        wrap.innerHTML =
          '<div class="adm-head"><span>Panel Admin · ' + CONFIG.adminName + '</span><span id="admInfo"></span></div>' +
          '<div class="adm-list" id="admList"></div>' +
          '<div class="adm-chat" id="admChat" role="log" aria-live="polite"></div>' +
          '<form class="adm-form" id="admForm" hidden><input id="admInput" type="text" maxlength="1000" placeholder="Balas pembeli..." autocomplete="off"><button type="submit">Kirim</button></form>';
        document.body.appendChild(wrap);
        $('admForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const input = $('admInput');
          const teks = input.value.trim();
          if (!teks || !adm.current) return;
          input.value = '';
          simpanPesan(adm.current, { cid: makeId(), arah: 'admin', teks, waktu: new Date().toISOString() });
          adm.sig = '';
          admRefresh();
        });
        // Browser meminta satu klik sebelum suara boleh diputar
        document.addEventListener('click', () => {
          try {
            adm.audio = adm.audio || new (window.AudioContext || window.webkitAudioContext)();
            adm.audio.resume();
          } catch (err) { /* tidak apa-apa */ }
        }, { once: true });
        admRefresh();
        setInterval(admRefresh, 1200);
      }

      function startBuyer() {
        buyer.id = readLocal('kujr_buyer_id') || makeId();
        saveLocal('kujr_buyer_id', buyer.id);
        buyerEl.name.value = readLocal('kujr_buyer_name');
        buyerEl.email.value = readLocal('kujr_buyer_email');

        // Data pesanan dari halaman pembelian (index.html) diambil dari alamat.
        // Jika tidak ada, pakai pesanan terakhir yang tersimpan di perangkat ini.
        const fromLink = readOrderFromUrl();
        if (fromLink) {
          state.order = fromLink;
          saveOrder(fromLink);
          if (fromLink.nama) buyerEl.name.value = fromLink.nama;
          if (fromLink.gmail) buyerEl.email.value = fromLink.gmail;
          persistBuyer();
        } else {
          state.order = loadSavedOrder();
        }

        buyerEl.adminName.textContent = CONFIG.adminName;
        document.title = 'Chat ' + CONFIG.adminName;
        setAvatar(buyerEl.avatar);
        trackScroll(buyerEl.chat);
        addBubble(buyerEl.chat, 'in', { text: CONFIG.welcomeMessage });

        syncPembeli();
        setInterval(syncPembeli, 1500);
        if (fromLink) sendOrder(fromLink); // daftar data langsung terkirim sebagai pesan pertama

        if (CONFIG.notifyUrl) {
          setStatus('menghubungkan...');
          pollBuyer();
          setInterval(pollBuyer, CONFIG.buyerPollMs);
        } else {
          setStatus('mode demo');
          showToast('Mode demo: belum tersambung ke server. Pesan hanya tampil di layar ini.', 4500);
        }
      }

      /* =====================================================================
         EVENT
         ===================================================================== */
      buyerEl.form.addEventListener('submit', (e) => {
        e.preventDefault();
        sendText();
      });

      buyerEl.file.addEventListener('change', () => {
        const files = Array.from(buyerEl.file.files || []);
        buyerEl.file.value = ''; // agar file yang sama bisa dipilih lagi nanti
        if (!files.length) return;
        if (!requireName({ type: 'files', files })) return;
        persistBuyer();
        files.forEach((file) => { handleUpload(file); });
      });

      buyerEl.name.addEventListener('change', persistBuyer);
      buyerEl.email.addEventListener('change', persistBuyer);

      buyerEl.name.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          buyerEl.email.focus();
        }
      });

      buyerEl.email.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          buyerEl.input.focus();
        }
      });

      buyerEl.dialogForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = buyerEl.dialogName.value.trim();
        if (!name) {
          buyerEl.dialogError.textContent = 'Nama wajib diisi.';
          buyerEl.dialogName.focus();
          return;
        }
        buyerEl.name.value = name;
        buyerEl.dialog.hidden = true;
        persistBuyer();

        // Kirim ulang aksi yang tadi tertahan karena nama belum ada
        const action = buyer.pending;
        buyer.pending = null;
        if (action && action.type === 'text') sendText();
        if (action && action.type === 'files') action.files.forEach((file) => { handleUpload(file); });
      });

      buyerEl.dialogCancel.addEventListener('click', () => {
        const action = buyer.pending;
        buyer.pending = null;
        buyerEl.dialog.hidden = true;
        if (action && action.type === 'files') showToast('Pengiriman file dibatalkan.', 2500);
      });

      buyerEl.dialog.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') buyerEl.dialogCancel.click();
      });

      /* =====================================================================
         LAYAR HP: tetap pas saat keyboard muncul (Visual Viewport API)
         ===================================================================== */
      const mobileQuery = window.matchMedia('(max-width: 767px)');

      function syncViewport() {
        const vv = window.visualViewport;
        if (!vv || !mobileQuery.matches) {
          buyerEl.app.style.height = '';
          buyerEl.app.style.transform = '';
        } else {
          buyerEl.app.style.height = vv.height + 'px';
          buyerEl.app.style.transform = 'translateY(' + vv.offsetTop + 'px)';
        }
        if (buyerEl.chat.dataset.stick === '1') buyerEl.chat.scrollTop = buyerEl.chat.scrollHeight;
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport);
        window.visualViewport.addEventListener('scroll', syncViewport);
      }
      window.addEventListener('resize', syncViewport);
      window.addEventListener('focusin', () => setTimeout(syncViewport, 150));

      if (ADMIN_MODE) startAdmin(); else startBuyer();
      syncViewport();
    })();
  </script>
</body>
</html>
