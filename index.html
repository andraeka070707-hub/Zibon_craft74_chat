<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="Chat pembeli addon KUJR">
  <link rel="icon" href="data:,">
  <title>Chat admin zibon_craft74</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Atribut hidden harus selalu menang atas aturan display */
    [hidden] { display: none !important; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111b21;
      background: #efeae2;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ---------- Kerangka layar (penuh di HP) ---------- */
    .app {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      background: #efeae2;
      overflow: hidden;
    }

    /* ---------- Header hijau ---------- */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: #075e54;
      color: #fff;
      flex-shrink: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: #b0bec5;
    }

    .header-info { min-width: 0; flex: 1; }

    .admin-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #25d366;
    }

    /* ---------- Bar identitas pembeli ---------- */
    .buyer-bar {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      background: #f0f2f5;
      border-bottom: 1px solid #d1d7db;
      flex-shrink: 0;
    }

    .buyer-bar input {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px; /* 16px mencegah zoom otomatis di iPhone */
      outline: none;
    }

    .buyer-bar input:focus {
      border-color: #00a884;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
    }

    /* ---------- Area chat ---------- */
    .chat-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 10px 12px 14px;
      background-color: #efeae2;
      background-image: radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .date-pill {
      display: table;
      margin: 4px auto 8px;
      padding: 5px 12px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
      font-size: 12.5px;
      color: #54656f;
      text-transform: uppercase;
    }

    .msg-row {
      display: flex;
      margin-top: 8px;
      animation: pop 0.18s ease-out;
    }

    .msg-row.grouped { margin-top: 2px; }

    .msg-row.in  { justify-content: flex-start; }
    .msg-row.out { justify-content: flex-end; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- Balon pesan ---------- */
    .bubble {
      position: relative;
      display: flow-root;
      max-width: 80%;
      padding: 6px 8px 6px 9px;
      border-radius: 8px;
      font-size: 14.2px;
      line-height: 1.35;
      color: #111b21;
      overflow-wrap: anywhere;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
    }

    .bubble.in  { background: #ffffff; border-top-left-radius: 0; }
    .bubble.out { background: #dcf8c6; border-top-right-radius: 0; }
    .bubble.file { min-width: 210px; }

    .bubble.in.grouped  { border-top-left-radius: 8px; }
    .bubble.out.grouped { border-top-right-radius: 8px; }

    .bubble.in::before,
    .bubble.out::after {
      content: "";
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .bubble.in::before {
      left: -8px;
      border-width: 0 8px 8px 0;
      border-color: transparent #ffffff transparent transparent;
    }

    .bubble.out::after {
      right: -8px;
      border-width: 0 0 8px 8px;
      border-color: transparent transparent transparent #dcf8c6;
    }

    .bubble.grouped::before,
    .bubble.grouped::after { display: none; }

    .msg-text { white-space: pre-line; }

    /* Tombol unduhan di dalam balon (dipakai setelah bukti valid) */
    .bubble-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 16px;
      background: #075e54;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
    }

    .meta {
      float: right;
      display: flex;
      align-items: center;
      gap: 3px;
      margin: 4px 0 0 10px;
      font-size: 11px;
      line-height: 1;
      color: #667781;
    }

    .ticks { font-size: 12px; letter-spacing: -2px; color: #8696a0; }
    .ticks.read { color: #53bdeb; }
    .ticks.failed { color: #d93025; letter-spacing: 0; }

    /* ---------- Isi file ---------- */
    .file-wrap { min-width: 0; }

    .file-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .thumb {
      display: block;
      max-width: 100%;
      max-height: 280px;
      height: auto;
      border-radius: 6px;
      background: #d9d9d9;
    }

    .file-caption {
      margin-top: 4px;
      font-size: 12px;
      color: #667781;
      overflow-wrap: anywhere;
    }

    .file-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #f0f2f5;
      font-size: 22px;
    }

    .file-info { min-width: 0; flex: 1; }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .file-size {
      margin-top: 2px;
      font-size: 12px;
      color: #667781;
    }

    /* ---------- Kolom ketik: lampiran · teks · kirim ---------- */
    .composer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: #f0f2f5;
      flex-shrink: 0;
    }

    .attach-wrap {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .attach-btn {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Input file transparan menutupi ikon, supaya pemilih file HP terbuka dari sentuhan pengguna */
    .file-input {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
      font-size: 0;
    }

    .attach-wrap:hover .attach-btn  { background: rgba(0, 0, 0, 0.06); }
    .attach-wrap:active .attach-btn { background: rgba(0, 0, 0, 0.12); }

    .attach-wrap:has(.file-input:focus-visible) .attach-btn {
      outline: 2px solid #00a884;
      outline-offset: 2px;
    }

    .msg-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 16px;
      border: none;
      border-radius: 21px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .msg-input:focus { box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.25); }

    .send-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:active { transform: scale(0.95); }

    /* ---------- Notifikasi kecil ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(76px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 9px 14px;
      border-radius: 8px;
      background: rgba(17, 27, 33, 0.92);
      color: #fff;
      font-size: 13.5px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
    }

    /* ---------- Dialog nama pembeli ---------- */
    .dialog-overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(11, 20, 26, 0.45);
    }

    .dialog {
      width: 100%;
      max-width: 340px;
      padding: 20px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .dialog-title {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 600;
      color: #111b21;
    }

    .dialog-text {
      margin: 0 0 14px;
      font-size: 13.5px;
      line-height: 1.4;
      color: #54656f;
    }

    .dialog-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d7db;
      border-radius: 8px;
      background: #fff;
      color: #111b21;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .dialog-input:focus {
      border-color: #00a884;
      box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
    }

    .dialog-error {
      min-height: 18px;
      margin-top: 6px;
      font-size: 12.5px;
      color: #d93025;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost   { background: transparent; color: #00a884; }
    .btn-primary { background: #00a884; color: #fff; }

    /* ---------- Desktop: tampilan kartu di tengah layar ---------- */
    @media (min-width: 768px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2vh 0;
        background: #d1d7db;
      }

      .app {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        left: auto;
        width: 100%;
        max-width: 960px;
        height: 96vh;
        max-height: 900px;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(11, 20, 26, 0.25);
      }

      .bubble { max-width: 62%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg-row { animation: none; }
    }

    /* ---------- Kartu QR DANA (muncul setelah pesanan dikirim) ---------- */
    .dana-card {
      margin-top: 8px;
      padding: 12px 10px 10px;
      border-radius: 8px;
      background: #f0faf5;
      text-align: center;
    }

    .dana-amount { margin-bottom: 8px; font-size: 15px; font-weight: 700; color: #075e54; }

    .dana-qr {
      display: block;
      width: 100%;
      max-width: 230px;
      height: auto;
      margin: 0 auto;
      border-radius: 6px;
      background: #ffffff;
    }

    .dana-number { margin-top: 10px; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }

    .dana-hint { margin-top: 2px; font-size: 12.5px; color: #667781; }

    .dana-copy {
      margin-top: 8px;
      padding: 7px 16px;
      border: 0;
      border-radius: 16px;
      background: #075e54;
      color: #ffffff;
      font: inherit;
      font-size: 13.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ===================== HALAMAN CHAT PEMBELI ===================== -->
  <div class="app" id="buyerApp">
    <header class="chat-header">
      <img class="avatar" id="adminAvatar" alt="Foto profil admin" width="40" height="40">
      <div class="header-info">
        <div class="admin-name" id="adminName">admin zibon_craft74</div>
        <div class="admin-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">online</span>
        </div>
      </div>
    </header>

    <!-- Identitas pembeli: nama wajib, email opsional -->
    <section class="buyer-bar" aria-label="Data pembeli">
      <input type="text" id="buyerName" placeholder="Nama Anda *" maxlength="40" autocomplete="name" enterkeyhint="next">
      <input type="email" id="buyerEmail" placeholder="Email (opsional)" maxlength="80" autocomplete="email" enterkeyhint="done">
    </section>

    <div class="chat-body" id="chatBody" role="log" aria-live="polite">
      <div class="date-pill">Hari ini</div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="attach-wrap">
        <label for="fileInput" class="attach-btn" title="Kirim bukti pembayaran atau file">
          <span aria-hidden="true">📎</span>
        </label>
        <input type="file" id="fileInput" class="file-input" accept="*/*" aria-label="Lampirkan file">
      </div>

      <input type="text" class="msg-input" id="messageInput" placeholder="Ketik pesan" maxlength="1000" autocomplete="off" enterkeyhint="send">

      <button type="submit" class="send-btn" aria-label="Kirim pesan">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </form>

    <!-- Dialog nama: muncul jika pembeli mengirim sesuatu tanpa mengisi nama -->
    <div class="dialog-overlay" id="nameDialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <form id="dialogForm" autocomplete="off">
          <h2 class="dialog-title" id="dialogTitle">Isi nama Anda</h2>
          <p class="dialog-text">Nama diperlukan sebelum mengirim pesan atau bukti pembayaran.</p>
          <input type="text" id="dialogName" class="dialog-input" placeholder="Nama Anda" maxlength="40" autocomplete="name">
          <div class="dialog-error" id="dialogError" role="alert"></div>
          <div class="dialog-actions">
            <button type="button" class="btn btn-ghost" id="dialogCancel">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      /* =====================================================================

         ===================================================================== */
      const MIN = 60 * 1000;
      const HOUR = 60 * MIN;
      const WIB_OFFSET = 7 * HOUR;              // Asia/Jakarta = UTC+7
      const MAX_FILE_BYTES = CONFIG.maxFileMB * 1024 * 1024;
      const COMPRESS_OVER_BYTES = 1024 * 1024;  // gambar di atas 1 MB dikecilkan dulu sebelum dikirim
      const COMPRESS_MAX_SIDE = 1600;
      const STICK_PX = 60;
      const JSONP_TIMEOUT_MS = 15000;
      const IMAGE_EXT_RE = /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i;
      const BULAN = {
        jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, agt: 8, aug: 8, ags: 8,
        sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12,
      };
      const PROOF_TOTAL_RE = /total\s*transfer\s*:?\s*\*?\s*(Rp\s?[\d.,]+)/i;
      const PROOF_INVOICE_RE = /no\.?\s*invoice\s*:?\s*\*?\s*([A-Za-z0-9-]+)/i;
      const SIZE_FORMAT = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1 });
      const DAY_FORMAT = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' });
      const TICKS = {
        pending: { text: '✓', cls: 'ticks' },
        sent: { text: '✓✓', cls: 'ticks' },
        read: { text: '✓✓', cls: 'ticks read' },
        failed: { text: '!', cls: 'ticks failed' },
      };
      const DEFAULT_AVATAR =
        'data:image/svg+xml;charset=utf-8,' +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
          '<rect width="100" height="100" fill="#b0bec5"/>' +
          '<circle cx="50" cy="38" r="18" fill="#ffffff"/>' +
          '<path d="M20 92c3-22 15-32 30-32s27 10 30 32z" fill="#ffffff"/>' +
          '</svg>'
        );

      const buyer = { id: '', seen: new Set(), pending: null, polling: false };
      const state = { order: null };   // data pesanan yang sedang berlaku
      let toastTimer = null;
      let jsonpCount = 0;
      let ocrLoading = null;

      /* =====================================================================
         ELEMEN HALAMAN
         ===================================================================== */
      const $ = (id) => document.getElementById(id);
      const toastEl = $('toast');

      const buyerEl = {
        app: $('buyerApp'),
        avatar: $('adminAvatar'),
        adminName: $('adminName'),
        status: $('statusText'),
        name: $('buyerName'),
        email: $('buyerEmail'),
        chat: $('chatBody'),

        dialog: $('nameDialog'),
        dialogForm: $('dialogForm'),
        dialogName: $('dialogName'),
        dialogError: $('dialogError'),
        dialogCancel: $('dialogCancel'),
      };

      /* =====================================================================
         UTILITAS
         ===================================================================== */
      const pad = (n) => String(n).padStart(2, '0');

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
      }

      function saveLocal(key, value) {
        try { localStorage.setItem(key, value); } catch (err) { /* penyimpanan diblokir: lewati */ }
      }

      function readLocal(key) {
        try { return localStorage.getItem(key) || ''; } catch (err) { return ''; }
      }

      function formatTime(value) {
        const d = value ? new Date(value) : new Date();
        if (Number.isNaN(d.getTime())) return formatTime();
        return pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      function formatKB(kb) {
        return SIZE_FORMAT.format(kb) + ' KB';
      }

      function rupiah(n) {
        return 'Rp' + Number(n).toLocaleString('id-ID');
      }

      function toInt(v) {
        const n = parseInt(String(v || '').replace(/\D/g, ''), 10);
        return Number.isFinite(n) && n > 0 ? n : 0;
      }

      // "Rp25.094" atau "1.500" -> 25094 atau 1500. Desimal ",00" di belakang diabaikan.
      function toAmount(s) {
        const n = parseInt(String(s).replace(/,\d{2}$/, '').replace(/\D/g, ''), 10);
        return Number.isFinite(n) && n > 0 ? n : null;
      }

      function isImageFile(file) {
        return (file.type || '').indexOf('image/') === 0 || IMAGE_EXT_RE.test(file.name);
      }

      function showToast(message, ms) {
        toastEl.textContent = message;
        toastEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms || 2600);
      }

      function setAvatar(img) {
        img.addEventListener('error', () => {
          if (img.dataset.fallback) return;
          img.dataset.fallback = '1';
          img.src = DEFAULT_AVATAR;
        });
        img.src = CONFIG.avatarUrl || DEFAULT_AVATAR;
      }

      function setStatus(text) {
        buyerEl.status.textContent = text;
      }

      /* =====================================================================
         SCROLL OTOMATIS
         ===================================================================== */
      function trackScroll(box) {
        box.dataset.stick = '1';
        box.addEventListener('scroll', () => {
          const gap = box.scrollHeight - box.scrollTop - box.clientHeight;
          box.dataset.stick = gap <= STICK_PX ? '1' : '0';
        }, { passive: true });
      }

      function scrollDown(box, force) {
        if (force || box.dataset.stick === '1') box.scrollTop = box.scrollHeight;
      }

      function keepInView(box, row) {
        scrollDown(box, row === box.lastElementChild);
      }

      /* =====================================================================

      function setTick(bubble, state) {

        const t = TICKS[state] || TICKS.pending;
        tick.textContent = t.text;
        tick.className = t.cls;
        bubble.dataset.tick = state;
      }

      function findBubble(box, cid) {
        return box.querySelector('.bubble[data-cid="' + CSS.escape(cid) + '"]');
      }

      function failBubble(bubble) {
        setTick(bubble, 'failed');
        showToast('Gagal mengirim. Periksa koneksi lalu coba lagi.');
      }

      function markSentAsRead(box) {
        box.querySelectorAll('.bubble.out').forEach((b) => {
          if (b.dataset.tick === 'sent') setTick(b, 'read');
        });
      }

      // Data file dari server (kolom Sheet) menjadi bentuk yang dipakai balon
      function fileOf(m) {
        if (!m.fileNama) return null;
        const link = typeof m.fileLink === 'string' && /^https?:\/\//i.test(m.fileLink) ? m.fileLink : '';
        return { name: m.fileNama, sizeKB: Number(m.fileKB) || 0, link };
      }

      function fileCard(file) {
        const card = document.createElement('div');
        card.className = 'file-card';

        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.textContent = file.previewUrl ? '🖼️' : '📦';

        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = file.name;

        const size = document.createElement('div');
        size.className = 'file-size';
        size.textContent = file.sub || formatKB(file.sizeKB);

        info.append(name, size);
        card.append(icon, info);
        return card;
      }

      function fileBody(file) {
        if (!file.previewUrl) {
          const card = fileCard(file);
          if (!file.link) return card;
          const a = document.createElement('a');
          a.className = 'file-link';
          a.href = file.link;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.appendChild(card);
          return a;
        }

        const wrap = document.createElement('div');
        wrap.className = 'file-wrap';

        const img = document.createElement('img');
        img.className = 'thumb';
        img.alt = file.name;
        img.src = file.previewUrl;
        // Format yang tidak bisa ditampilkan browser (mis. HEIC): tampilkan kartu file saja
        img.onerror = () => wrap.replaceChildren(fileCard(Object.assign({}, file, { previewUrl: '' })));

        const caption = document.createElement('div');
        caption.className = 'file-caption';
        caption.textContent = file.name + ' · ' + formatKB(file.sizeKB);

        wrap.append(img, caption);
        return wrap;
      }

      function replaceFileBody(bubble, box, file) {
        const old = bubble.querySelector('.file-wrap, .file-card, .file-link');
        const body = fileBody(file);
        const img = body.querySelector('img');
        if (img) img.addEventListener('load', () => keepInView(box, bubble.parentElement));
        if (old) old.replaceWith(body);
        else bubble.insertBefore(body, bubble.firstChild);
      }

      // Menambah satu balon. side = 'in' (admin/sistem) atau 'out' (pembeli).
      // o.link = { url, label } menampilkan tombol unduhan di dalam balon.
      function addBubble(box, side, o) {
        const prev = box.lastElementChild;
        const grouped = !!prev && prev.classList.contains('msg-row') && prev.classList.contains(side);

        const row = document.createElement('div');
        row.className = 'msg-row ' + side + (grouped ? ' grouped' : '');

        const bubble = document.createElement('div');
        bubble.className = 'bubble ' + side + (o.file ? ' file' : '') + (grouped ? ' grouped' : '');
        if (o.cid) bubble.dataset.cid = o.cid;

        if (o.file) {
          const body = fileBody(o.file);
          const img = body.querySelector('img');
          if (img) img.addEventListener('load', () => keepInView(box, row));
          bubble.appendChild(body);
        }

        if (o.text) {
          const text = document.createElement('div');
          text.className = 'msg-text';
          text.textContent = o.text;
          bubble.appendChild(text);
        }

        if (o.link) {
          const a = document.createElement('a');
          a.className = 'bubble-link';
          a.href = o.link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = o.link.label;
          bubble.appendChild(a);
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        const time = document.createElement('span');
        time.textContent = formatTime(o.time);
        meta.appendChild(time);
        if (side === 'out') {
          const tick = document.createElement('span');
          tick.className = 'ticks';
          meta.appendChild(tick);
        }
        bubble.appendChild(meta);

        row.appendChild(bubble);
        box.appendChild(row);
        if (side === 'out') setTick(bubble, o.tick || 'pending');
        scrollDown(box, true);
        return bubble;
      }

      /* =====================================================================
         KARTU QR DANA
         ===================================================================== */
      function addDanaCard(box, proof) {
        const bubble = addBubble(box, 'in', {
          text: 'Silakan bayar lewat DANA sesuai nominal di bawah ini. Setelah bayar, kirim screenshot bukti transaksi terbaru di chat ini.',
        });

        const card = document.createElement('div');
        card.className = 'dana-card';

        if (proof.total) {
          const amount = document.createElement('div');
          amount.className = 'dana-amount';
          amount.textContent = 'Transfer persis ' + rupiah(proof.total);
          card.appendChild(amount);
        }

        const qr = document.createElement('img');
        qr.className = 'dana-qr';
        qr.alt = 'Kode QR DANA ' + CONFIG.danaNumber;
        qr.src = CONFIG.qrUrl;
        qr.addEventListener('load', () => keepInView(box, bubble.parentElement));
        qr.addEventListener('error', () => qr.remove()); // QR belum ada: nomor tetap tampil

        const number = document.createElement('div');
        number.className = 'dana-number';
        number.textContent = CONFIG.danaNumber;

        const hint = document.createElement('div');
        hint.className = 'dana-hint';
        hint.textContent = 'Cuma bisa dibayar pakai DANA' + (proof.invoice ? ' · ' + proof.invoice : '');

        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'dana-copy';
        copy.textContent = 'Salin nomor';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(CONFIG.danaNumber);
            showToast('Nomor DANA disalin.');
          } catch (err) {
            showToast('Gagal menyalin. Salin nomornya secara manual.', 3500);
          }
        });

        card.append(qr, number, hint, copy);
        bubble.insertBefore(card, bubble.querySelector('.meta'));
        keepInView(box, bubble.parentElement);
      }

      // Teks tagihan dari pesan pembeli -> { total, invoice } (atau null jika bukan tagihan)
      function parseProof(text) {
        if (!text) return null;
        const t = PROOF_TOTAL_RE.exec(text);
        const i = PROOF_INVOICE_RE.exec(text);
        if (!t && !i) return null;
        return { total: t ? toAmount(t[1]) || 0 : 0, invoice: i ? i[1] : '' };
      }

      /* =====================================================================
         DATA PESANAN
         ===================================================================== */
      // Teks daftar data yang dikirim otomatis. Format ini juga dibaca oleh dasbor admin.
      function buildBillText(o) {
        return [
          '*Nama:* ' + o.nama,
          '*Gmail:* ' + (o.gmail || '-'),
          '*Produk:* ' + o.produk,
          '*Harga:* ' + rupiah(o.harga),
          '*No. Invoice:* ' + o.invoice,
          '*Total transfer:* ' + rupiah(o.total),
        ].join('\n');
      }

      // Membaca data pesanan dari alamat (?nama=...&invoice=...). Alamat dibersihkan setelahnya,
      // supaya pesan tidak terkirim dua kali saat halaman dimuat ulang.
      function readOrderFromUrl() {
        const p = new URLSearchParams(window.location.search);
        if (!p.has('invoice') && !p.has('total')) return null;

        const harga = toInt(p.get('harga')) || CONFIG.hargaDefault;
        const order = {
          nama: (p.get('nama') || '').trim().slice(0, 40),
          gmail: (p.get('gmail') || '').trim().slice(0, 80),
          produk: (p.get('produk') || CONFIG.produk).slice(0, 120),
          harga,
          invoice: (p.get('invoice') || '').replace(/[^A-Za-z0-9-]/g, '').slice(0, 40),
          total: toInt(p.get('total')) || harga,
        };

        ['nama', 'gmail', 'produk', 'harga', 'invoice', 'total'].forEach((k) => p.delete(k));
        const rest = p.toString();
        try {
          history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);
        } catch (err) { /* alamat tidak bisa diubah: lewati */ }
        return order;
      }

      function loadSavedOrder() {
        try { return JSON.parse(readLocal('kujr_order') || 'null'); } catch (err) { return null; }
      }

      function saveOrder(o) {
        saveLocal('kujr_order', JSON.stringify(o));
      }

      // Mengirim daftar data sebagai pesan pertama, lalu menampilkan kartu QR DANA
      function sendOrder(o) {
        const text = buildBillText(o);
        const cid = makeId();
        buyer.seen.add(cid);
        const bubble = addBubble(buyerEl.chat, 'out', { cid, text, tick: 'pending' });

        if (CONFIG.notifyUrl) {
          postJSON({
            action: 'buyerMessage',
            buyerId: buyer.id,
            cid,
            nama: o.nama,
            email: o.gmail,
            teks: text,
          }).catch(() => failBubble(bubble));
        } else {
          setTick(bubble, 'sent');
        }

        addDanaCard(buyerEl.chat, { total: o.total, invoice: o.invoice });
      }

      /* =====================================================================
         PEMERIKSAAN BUKTI TRANSAKSI (OCR di browser)
         ===================================================================== */
      function loadOcr() {
        if (window.Tesseract) return Promise.resolve();
        if (!ocrLoading) {
          ocrLoading = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
            s.onload = () => resolve();
            s.onerror = () => { ocrLoading = null; reject(new Error('OCR gagal dimuat')); };
            document.head.appendChild(s);
          });
        }
        return ocrLoading;
      }

      async function readText(file) {
        await loadOcr();
        const result = await window.Tesseract.recognize(file, CONFIG.ocrLang);
        return (result && result.data && result.data.text) || '';
      }

      function wibTs(y, mo, d, h, mi) {
        if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59) return null;
        return Date.UTC(y, mo - 1, d, h, mi) - WIB_OFFSET;
      }

      // Mencari tanggal + jam transaksi dan nominal dari teks hasil OCR
      function parseReceipt(raw) {
        const text = String(raw || '');
        let ts = null;

        // contoh: "02 Nov 2026 • 21:54"
        let m = /(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})\D{0,6}?(\d{1,2})[:.](\d{2})/.exec(text);
        if (m) ts = wibTs(+m[3], BULAN[m[2].slice(0, 3).toLowerCase()] || 0, +m[1], +m[4], +m[5]);

        // contoh: "02/11/2026 21:54"
        if (ts === null) {
          m = /(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\D{0,6}?(\d{1,2})[:.](\d{2})/.exec(text);
          if (m) ts = wibTs(+m[3], +m[2], +m[1], +m[4], +m[5]);
        }

        // contoh: "2026-11-02 21:54"
        if (ts === null) {
          m = /(\d{4})-(\d{2})-(\d{2})\D{0,6}?(\d{1,2})[:.](\d{2})/.exec(text);
          if (m) ts = wibTs(+m[1], +m[2], +m[3], +m[4], +m[5]);
        }

        // Nominal: "Rp" pertama setelah "Total Bayar", jika tidak ada pakai "Rp" pertama di gambar
        let amount = null;
        const at = text.search(/total\s*bayar/i);
        const scope = at !== -1 ? text.slice(at, at + 160) : text;
        const rp = /Rp\.?\s?([0-9][0-9.,]*)/i.exec(scope);
        if (rp) amount = toAmount(rp[1]);

        return { ts, amount };
      }

      const dayOf = (ts) => DAY_FORMAT.format(new Date(ts)); // tanggal Asia/Jakarta: "YYYY-MM-DD"

      // Urutan pengecekan: tanggal & batas waktu dulu, baru nominal.
      function verdictOf(info, order) {
        if (!info.ts || !info.amount) return 'tidakTerbaca';

        const now = Date.now();
        if (info.ts > now + 10 * MIN) return 'tidakTerbaca';       // jam di masa depan: salah baca
        if (dayOf(info.ts) !== dayOf(now)) return 'kadaluarsa';    // bukan hari ini
        if (now - info.ts > CONFIG.batasJam * HOUR) return 'kadaluarsa';

        const minimal = (order && order.total) || CONFIG.hargaDefault;
        if (info.amount < minimal) return 'kurang';
        return 'ok';
      }

      async function checkProof(file) {
        const waiting = addBubble(buyerEl.chat, 'in', { text: CONFIG.msg.memeriksa });

        let verdict;
        try {
          const text = await readText(file);
          verdict = verdictOf(parseReceipt(text), state.order);
        } catch (err) {
          verdict = 'tidakTerbaca';
        }

        waiting.parentElement.remove();

        if (verdict === 'ok') {
          addBubble(buyerEl.chat, 'in', {
            text: CONFIG.msg.sukses,
            link: { url: CONFIG.mediafireUrl, label: '⬇ Unduh addon KUJR' },
          });
        } else {
          addBubble(buyerEl.chat, 'in', { text: CONFIG.msg[verdict] });
        }
      }

      /* =====================================================================
         JARINGAN
         ===================================================================== */
      function jsonp(params) {
        return new Promise((resolve, reject) => {
          const cb = 'kujrChatCb' + (++jsonpCount) + '_' + Date.now();
          const query = new URLSearchParams(params);
          query.set('callback', cb);

          const script = document.createElement('script');
          const timer = setTimeout(() => finish(new Error('timeout')), JSONP_TIMEOUT_MS);

          function finish(err, data) {
            clearTimeout(timer);
            window[cb] = () => {};
            script.remove();
            if (err) reject(err);
            else resolve(data);
          }

          window[cb] = (data) => finish(null, data);
          script.onerror = () => finish(new Error('network'));
          script.src = CONFIG.notifyUrl + (CONFIG.notifyUrl.indexOf('?') === -1 ? '?' : '&') + query.toString();
          document.head.appendChild(script);
        });
      }

      function postJSON(body) {
        return fetch(CONFIG.notifyUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(body),
        });
      }

      function applyBuyerMessage(m) {
        if (buyer.seen.has(m.cid)) {
          const bubble = findBubble(buyerEl.chat, m.cid);
          if (bubble && m.arah === 'pembeli' && bubble.dataset.tick === 'pending') setTick(bubble, 'sent');
          return;
        }
        buyer.seen.add(m.cid);

        if (m.arah === 'pembeli') {
          addBubble(buyerEl.chat, 'out', { cid: m.cid, text: m.teks, file: fileOf(m), time: m.waktu, tick: 'sent' });
          const proof = parseProof(m.teks || '');
          if (proof) addDanaCard(buyerEl.chat, proof);
        } else {
          addBubble(buyerEl.chat, 'in', { cid: m.cid, text: m.teks, file: fileOf(m), time: m.waktu });
          markSentAsRead(buyerEl.chat);
        }
      }

      async function pollBuyer() {
        if (buyer.polling || document.hidden) return;
        buyer.polling = true;
        try {
          const res = await jsonp({ action: 'thread', buyerId: buyer.id });
          if (!res.ok) throw new Error(res.error || 'gagal');
          setStatus('online');
          res.messages.forEach(applyBuyerMessage);
        } catch (err) {
          setStatus('tidak terhubung');
        } finally {
          buyer.polling = false;
        }
      }

      /* =====================================================================
         FILE: BACA DAN KECILKAN GAMBAR (untuk dikirim ke admin)
         ===================================================================== */
      function readAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('baca gagal'));
          reader.readAsDataURL(file);
        });
      }

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            const scale = Math.min(1, COMPRESS_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('decode gagal'));
          };
          img.src = url;
        });
      }

      async function fileToDataUrl(file, isImage) {
        if (isImage && file.size > COMPRESS_OVER_BYTES) {
          try {
            return await compressImage(file);
          } catch (err) {
            // gagal dikecilkan: pakai file asli
          }
        }
        return readAsDataUrl(file);
      }

      // Mengirim lampiran ke admin, lalu (untuk gambar) memeriksa isi bukti
      async function handleUpload(file) {
        const isImage = isImageFile(file);
        if (!isImage && file.size > MAX_FILE_BYTES) {
          showToast('File terlalu besar. Maksimal ' + CONFIG.maxFileMB + ' MB.', 3500);
          return;
        }

        const cid = makeId();
        buyer.seen.add(cid);
        const bubble = addBubble(buyerEl.chat, 'out', {
          cid,
          file: { name: file.name, sizeKB: file.size / 1024, sub: 'Memproses...' },
          tick: 'pending',
        });

        try {
          const dataUrl = await fileToDataUrl(file, isImage);
          const base64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
          const bytes = Math.floor(base64.length * 3 / 4);
          if (bytes > MAX_FILE_BYTES) throw new Error('terlalu besar');
          const mime = dataUrl.slice(5, dataUrl.indexOf(';')) || 'application/octet-stream';

          replaceFileBody(bubble, buyerEl.chat, {
            name: file.name,
            sizeKB: bytes / 1024,
            previewUrl: isImage ? dataUrl : '',
          });

          if (CONFIG.notifyUrl) {
            postJSON({
              action: 'buyerMessage',
              buyerId: buyer.id,
              cid,
              nama: buyerEl.name.value.trim(),
              email: buyerEl.email.value.trim(),
              file: { name: file.name, type: mime, data: base64 },
            }).catch(() => failBubble(bubble));
          } else {
            setTick(bubble, 'sent');
          }
        } catch (err) {
          failBubble(bubble);
          showToast(err.message === 'terlalu besar'
            ? 'File terlalu besar (maks ' + CONFIG.maxFileMB + ' MB).'
            : 'File gagal dibaca. Coba file lain.', 3500);
          return;
        }

        if (isImage) await checkProof(file); // OCR memakai file asli, bukan hasil kompresi
        else addBubble(buyerEl.chat, 'in', { text: CONFIG.msg.fileDiterima });
      }

      /* =====================================================================
         PESAN PEMBELI & DIALOG NAMA
         ===================================================================== */
      function persistBuyer() {
        saveLocal('kujr_buyer_name', buyerEl.name.value.trim());
        saveLocal('kujr_buyer_email', buyerEl.email.value.trim());
      }

      // Mengembalikan true jika nama sudah ada. Jika belum, aksi disimpan dan dialog nama dibuka.
      function requireName(action) {
        if (buyerEl.name.value.trim()) return true;
        buyer.pending = action;
        buyerEl.dialogName.value = '';
        buyerEl.dialogError.textContent = '';
        buyerEl.dialog.hidden = false;
        buyerEl.dialogName.focus();
        return false;
      }

      function sendText() {
        const text = buyerEl.input.value.trim();
        if (!text) {
          buyerEl.input.focus();
          return;
        }
        if (!requireName({ type: 'text' })) return;

        persistBuyer();
        buyerEl.input.value = '';
        const cid = makeId();
        buyer.seen.add(cid);
        const bubble = addBubble(buyerEl.chat, 'out', { cid, text, tick: 'pending' });

        if (CONFIG.notifyUrl) {
          postJSON({
            action: 'buyerMessage',
            buyerId: buyer.id,
            cid,
            nama: buyerEl.name.value.trim(),
            email: buyerEl.email.value.trim(),
            teks: text,
          }).catch(() => failBubble(bubble));
        } else {
          setTick(bubble, 'sent');
        }

        const proof = parseProof(text);
        if (proof) addDanaCard(buyerEl.chat, proof);
        buyerEl.input.focus();
      }

      /* =====================================================================
         START
         ===================================================================== */
      function startBuyer() {
        buyer.id = readLocal('kujr_buyer_id') || makeId();
        saveLocal('kujr_buyer_id', buyer.id);
        buyerEl.name.value = readLocal('kujr_buyer_name');
        buyerEl.email.value = readLocal('kujr_buyer_email');

        // Data pesanan dari halaman pembelian (index.html) diambil dari alamat.
        // Jika tidak ada, pakai pesanan terakhir yang tersimpan di perangkat ini.
        const fromLink = readOrderFromUrl();
        if (fromLink) {
          state.order = fromLink;
          saveOrder(fromLink);
          if (fromLink.nama) buyerEl.name.value = fromLink.nama;
          if (fromLink.gmail) buyerEl.email.value = fromLink.gmail;
          persistBuyer();
        } else {
          state.order = loadSavedOrder();
        }

        buyerEl.adminName.textContent = CONFIG.adminName;
        document.title = 'Chat ' + CONFIG.adminName;
        setAvatar(buyerEl.avatar);
        trackScroll(buyerEl.chat);
        addBubble(buyerEl.chat, 'in', { text: CONFIG.welcomeMessage });

        if (fromLink) sendOrder(fromLink); // daftar data langsung terkirim sebagai pesan pertama

        if (CONFIG.notifyUrl) {
          setStatus('menghubungkan...');
          pollBuyer();
          setInterval(pollBuyer, CONFIG.buyerPollMs);
        } else {
          setStatus('mode demo');
          showToast('Mode demo: belum tersambung ke server. Pesan hanya tampil di layar ini.', 4500);
        }
      }

      /* =====================================================================
         EVENT
         ===================================================================== */
      buyerEl.form.addEventListener('submit', (e) => {
        e.preventDefault();
        sendText();
      });

      buyerEl.file.addEventListener('change', () => {
        const files = Array.from(buyerEl.file.files || []);
        buyerEl.file.value = ''; // agar file yang sama bisa dipilih lagi nanti
        if (!files.length) return;
        if (!requireName({ type: 'files', files })) return;
        persistBuyer();
        files.forEach((file) => { handleUpload(file); });
      });

      buyerEl.name.addEventListener('change', persistBuyer);
      buyerEl.email.addEventListener('change', persistBuyer);

      buyerEl.name.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          buyerEl.email.focus();
        }
      });

      buyerEl.email.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          buyerEl.input.focus();
        }
      });

      buyerEl.dialogForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = buyerEl.dialogName.value.trim();
        if (!name) {
          buyerEl.dialogError.textContent = 'Nama wajib diisi.';
          buyerEl.dialogName.focus();
          return;
        }
        buyerEl.name.value = name;
        buyerEl.dialog.hidden = true;
        persistBuyer();

        // Kirim ulang aksi yang tadi tertahan karena nama belum ada
        const action = buyer.pending;
        buyer.pending = null;
        if (action && action.type === 'text') sendText();
        if (action && action.type === 'files') action.files.forEach((file) => { handleUpload(file); });
      });

      buyerEl.dialogCancel.addEventListener('click', () => {
        const action = buyer.pending;
        buyer.pending = null;
        buyerEl.dialog.hidden = true;
        if (action && action.type === 'files') showToast('Pengiriman file dibatalkan.', 2500);
      });

      buyerEl.dialog.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') buyerEl.dialogCancel.click();
      });

      /* =====================================================================
         LAYAR HP: tetap pas saat keyboard muncul (Visual Viewport API)
         ===================================================================== */
      const mobileQuery = window.matchMedia('(max-width: 767px)');

      function syncViewport() {
        const vv = window.visualViewport;
        if (!vv || !mobileQuery.matches) {
          buyerEl.app.style.height = '';
          buyerEl.app.style.transform = '';
        } else {
          buyerEl.app.style.height = vv.height + 'px';
          buyerEl.app.style.transform = 'translateY(' + vv.offsetTop + 'px)';
        }
        if (buyerEl.chat.dataset.stick === '1') buyerEl.chat.scrollTop = buyerEl.chat.scrollHeight;
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport);
        window.visualViewport.addEventListener('scroll', syncViewport);
      }
      window.addEventListener('resize', syncViewport);
      window.addEventListener('focusin', () => setTimeout(syncViewport, 150));

      startBuyer();
      syncViewport();
    })();
  </script>
</body>
</html>
